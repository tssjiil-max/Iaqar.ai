<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>استكمال بيانات العقار | iAqar.ai</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#123;background:#f5f8f6}
    *{box-sizing:border-box}body{margin:0;padding:24px 16px}.wrap{max-width:560px;margin:auto}.card{background:#fff;border:1px solid #dce8e0;border-radius:20px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.05)}
    h1{font-size:1.45rem;margin:0 0 8px;color:#145c38}.muted{color:#607069;line-height:1.65;margin:0 0 18px}.office{font-weight:700;margin-bottom:18px}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;min-height:48px;border:1px solid #cfdcd3;border-radius:12px;padding:10px 12px;font:inherit;background:#fff}.field input:focus,.field select:focus{outline:2px solid #8bc5a5;border-color:#3b9164}
    button{width:100%;min-height:50px;border:0;border-radius:13px;background:#197447;color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:14px}button:disabled{opacity:.55;cursor:not-allowed}.status{padding:12px 14px;border-radius:12px;margin:14px 0;line-height:1.55}.status.error{background:#fff0f0;color:#8a2222}.status.ok{background:#eef9f2;color:#17633c}.hidden{display:none}.done{text-align:center;padding:16px 4px}.done h2{color:#17633c}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-live="polite">
      <h1>استكمال البيانات</h1>
      <p class="muted">أكمل البيانات المطلوبة فقط ليتمكن المكتب من متابعة الطلب بشكل صحيح.</p>
      <div id="officeLine" class="office"></div>
      <div id="status" class="status hidden"></div>
      <form id="form" class="hidden" autocomplete="on">
        <div id="fields"></div>
        <button id="submitBtn" type="submit">حفظ وإرسال</button>
      </form>
      <div id="done" class="done hidden"><h2>تم استكمال البيانات ✓</h2><p class="muted">وصلت البيانات للمكتب ويمكنك إغلاق هذه الصفحة.</p></div>
    </section>
  </main>
  <script type="module" src="/js/data-completion-page.js"></script>
</body>
</html>
