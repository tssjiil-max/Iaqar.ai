<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IAQAR QA Harness</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/content-v2.css">
  <link rel="stylesheet" href="/css/opportunity-details-v2.css">
  <link rel="stylesheet" href="/css/party-shell.css">
  <style>
    body { margin: 0; background: #f4f8f6; font-family: Tajawal, Arial, sans-serif; color: #19231f; }
    .qa-app { width: min(100%, 432px); margin: 0 auto; min-height: 100dvh; background: #f4f8f6; padding: 12px 12px 24px; box-sizing: border-box; }
    .qa-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .qa-tabs button { flex: 1; border: 0; background: #eaf5f1; color: #087064; font-weight: 800; padding: 10px 8px; border-radius: 12px; }
    .qa-tabs button.is-active { background: #005c4b; color: #fff; }
    .qa-panel[hidden] { display: none !important; }
    .cv2-inbox-section { margin: 12px 0 6px; font-size: 12px; font-weight: 800; color: #1a5319; }
    .cv2-inbox-section-rule { height: 1px; background: #e4eae7; margin: 4px 0 8px; }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #003f34; color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; display: none; z-index: 40; }
    .toast.show { display: block; }
    .qa-settings { background: #fff; border: 1px solid #dee7e2; border-radius: 16px; padding: 16px; }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.2 12.2 2.5 2.5 5.2-5.5"/></symbol>
    <symbol id="i-house" viewBox="0 0 24 24"><path d="m3.5 11 8.5-7.5 8.5 7.5"/><path d="M6 10.5V20h12v-9.5"/><path d="M10 20v-5h4v5"/></symbol>
    <symbol id="i-map-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-5.2 6.5-10.2A6.5 6.5 0 0 0 5.5 10.8C5.5 15.8 12 21 12 21z"/><circle cx="12" cy="10.8" r="2.2"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.4"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="m20.2 10.2-6.4 6.4a2 2 0 0 1-2.8 0L4.6 10.2a2 2 0 0 1 0-2.8l6.4-6.4a2 2 0 0 1 2.8 0l6.4 6.4a2 2 0 0 1 0 2.8z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M8.2 3.8h3.1l1.2 3-2 1.2a12 12 0 0 0 5.5 5.5l1.2-2 3 1.2v3.1c0 .8-.6 1.5-1.4 1.6-7.2.9-13.2-5.1-12.3-12.3.1-.8.8-1.3 1.7-1.3z"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 16.4 15.7 4.7a1.8 1.8 0 0 1 2.6 0l1 1a1.8 1.8 0 0 1 0 2.6L7.6 20H4z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.2 19c.6-3.4 3.2-5.2 6.8-5.2s6.2 1.8 6.8 5.2"/></symbol>
    <symbol id="i-clipboard-list" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2.3"/><path d="M9 4V2.5h6V4"/><path d="M9 9h6"/><path d="M9 13h6"/><path d="M9 17h4"/></symbol>
  </svg>
  <div class="qa-app" data-testid="qa-app">
    <nav class="qa-tabs" role="tablist">
      <button type="button" class="is-active" data-testid="tab-tasks" data-qa-tab="tasks">المهام اليومية</button>
      <button type="button" data-testid="tab-offers" data-qa-tab="offers">العروض والطلبات</button>
      <button type="button" data-testid="tab-settings" data-qa-tab="settings">إعداد المكتب</button>
    </nav>
    <div id="contentV2" class="content-v2 qa-panel" data-testid="panel-tasks"></div>
    <div id="inboxRoot" class="qa-panel" data-testid="panel-offers" hidden></div>
    <div id="settingsRoot" class="qa-panel" data-testid="panel-settings" hidden>
      <section class="qa-settings" id="cooperationSection">
        <h3>التعاون بين المكاتب</h3>
        <p>إعدادات وضوابط فقط. متابعة التعاون اليومي تتم من المهام اليومية، والسجل يحفظ التعاون المنتهي.</p>
        <label class="pref-row">
          <span>تشغيل التعاون</span>
          <input type="checkbox" id="cooperationEnabledToggle" data-testid="cooperation-enabled" checked>
        </label>
      </section>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/js/qa/boot.js"></script>
</body>
</html>
