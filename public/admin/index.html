<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>لوحة الإدارة - مكاتب عقارية ذكية</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #fff;
      --line: #e5e7eb;
      --text: #1f2937;
      --muted: #4b5563;
      --brand: #064e3b;
      --accent: #065f46;
      --danger: #9e3434;
      --ok: #07634f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Tajawal, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100svh;
    }
    .admin-header {
      background: var(--brand);
      color: #fff;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(6, 78, 59, 0.2);
    }
    .admin-header-inner {
      max-width: 42rem;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .admin-header h1 {
      margin: 0;
      font-size: 18px;
      color: #fff;
    }
    .env-badge {
      font-size: 12px;
      background: #065f46;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .shell { max-width: 42rem; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
    .card {
      background: var(--card);
      border: 1px solid #f3f4f6;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    h1, h2 { color: var(--brand); margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 12px; }
    .tab-switch {
      display: flex;
      background: #fff;
      border-radius: 16px;
      padding: 4px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      margin-bottom: 24px;
    }
    .tab-switch button {
      flex: 1;
      border: 0;
      background: transparent;
      color: #4b5563;
      border-radius: 12px;
      padding: 10px 12px;
      font: 600 15px Tajawal;
      cursor: pointer;
    }
    .tab-switch button.active {
      background: var(--brand);
      color: #fff;
    }
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 12px;
      font: 700 14px Tajawal;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .btn.secondary { background: #f3f4f6; color: #374151; }
    .btn.danger { background: #fff0f0; color: var(--danger); border: 1px solid #f0c7c7; }
    .btn.block { width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      background: #f8fcfa;
    }
    .stat strong { display: block; font-size: 24px; color: var(--brand); }
    .stat span { font-size: 13px; color: var(--muted); }
    .toolbar { display: grid; gap: 8px; margin-bottom: 12px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      font: 500 15px Tajawal;
      background: #fff;
    }
    textarea { min-height: 90px; resize: vertical; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tabs button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 8px 10px;
      font: 700 13px Tajawal;
      cursor: pointer;
    }
    .tabs button.active { background: #ecfdf5; color: var(--brand); }
    .list-item, .task-card {
      border: 1px solid #f3f4f6;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .list-item h3, .task-card h3 { margin: 0 0 6px; font-size: 16px; color: #1f2937; }
    .task-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .meta { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #ecfdf5;
      color: #065f46;
      white-space: nowrap;
    }
    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .task-actions .btn { width: auto; }
    .status { display: none; margin-top: 10px; padding: 10px; border-radius: 12px; font-size: 14px; }
    .status.show { display: block; }
    .status.err { background: #fff0f0; color: var(--danger); }
    .status.ok { background: #e8f7f2; color: var(--ok); }
    .hidden { display: none !important; }
    .row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .user-line { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="admin-header-inner">
      <h1>لوحة إدارة المنصة (Admin)</h1>
      <span class="env-badge">بيئة التحكم</span>
    </div>
  </header>
  <div class="shell" id="app">
    <div class="card" id="loginCard">
      <h2>دخول مخصص لمدير المنصة فقط</h2>
      <form id="loginForm" class="toolbar">
        <input name="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني" required>
        <input name="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" required>
        <button class="btn block" type="submit">دخول الإدارة</button>
      </form>
      <div id="status" class="status"></div>
    </div>
    <div id="console" class="hidden">
      <p class="user-line" id="adminUserLine">مرحبًا</p>
      <div class="tab-switch" id="mainNav"></div>
      <div id="viewRoot"></div>
      <div id="consoleStatus" class="status"></div>
      <button class="btn secondary block" id="logoutBtn" type="button">تسجيل الخروج</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="/js/runtime-config.js"></script>
  <script type="module" src="/js/admin-console.js"></script>
</body>
</html>
