<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إدارة المنصة</title>
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #005C4B;
      --green-dark: #003F34;
      --green-2: #08715E;
      --green-soft: #EAF5F1;
      --gold: #C5A059;
      --bg: #F1F5F2;
      --card: #fff;
      --line: #DEE7E2;
      --text: #19231F;
      --muted: #79847F;
      --brand: #005C4B;
      --accent: #08715E;
      --danger: #9e3434;
      --ok: #07634f;
      --shadow: 0 9px 26px rgba(0, 63, 52, .08);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Tajawal, "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 94% 3%, rgba(197, 160, 89, .07), transparent 18%),
        linear-gradient(180deg, #FAFCFB 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100svh;
    }
    .admin-app {
      width: min(100%, 432px);
      margin: 0 auto;
      padding: 8px 10px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    @media (min-width: 768px) {
      .admin-app { width: min(100%, 720px); padding: 12px 16px calc(18px + env(safe-area-inset-bottom)); }
    }
    @media (min-width: 1024px) {
      .admin-app { width: min(100%, 960px); }
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(0, 92, 75, .08);
      border-radius: 28px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .header {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 6px;
      padding: 0 0 4px;
      background: #FAFCFB;
      border: 0;
      box-shadow: none;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header-banner {
      width: 100%;
      height: auto;
      display: block;
      border: 0;
    }
    .header h1 {
      margin: 0;
      text-align: center;
      color: var(--green);
      font-family: "Noto Naskh Arabic", "Amiri", "Traditional Arabic", serif;
      font-size: clamp(22px, 5.6vw, 28px);
      font-weight: 700;
      line-height: 1.35;
    }
    h2 { color: var(--green); margin: 0 0 8px; font-size: 16px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 12px; }
    label {
      display: block;
      margin: 0 0 6px;
      color: #3d4a45;
      font-size: 14px;
      font-weight: 700;
    }
    .field { display: grid; gap: 0; }
    .tab-switch {
      display: flex;
      gap: 6px;
      background: #fff;
      border: 1px solid rgba(0, 92, 75, .08);
      border-radius: 18px;
      padding: 4px;
      box-shadow: var(--shadow);
    }
    .tab-switch button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 14px;
      padding: 10px 12px;
      font: 700 14px Tajawal;
      cursor: pointer;
    }
    .tab-switch button.active {
      background: var(--green);
      color: #fff;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 13px 16px;
      font: 800 15px Tajawal;
      cursor: pointer;
      background: var(--green);
      color: #fff;
    }
    .btn.secondary { background: var(--green-soft); color: var(--green); }
    .btn.danger { background: #fff0f0; color: var(--danger); border: 1px solid #f0c7c7; }
    .btn.block { width: 100%; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px;
      background: #f8fcfa;
    }
    .stat strong { display: block; font-size: 24px; color: var(--green); }
    .stat span { font-size: 13px; color: var(--muted); }
    .toolbar { display: grid; gap: 12px; margin-bottom: 12px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px 16px;
      font: 500 15px Tajawal;
      background: #fff;
      color: var(--text);
    }
    textarea { min-height: 90px; resize: vertical; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .tabs button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 12px;
      padding: 8px 10px;
      font: 700 13px Tajawal;
      cursor: pointer;
    }
    .tabs button.active { background: var(--green-soft); color: var(--green); }
    .list-item, .task-card {
      border: 1px solid rgba(0, 92, 75, .08);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 10px;
      background: #fff;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .04);
    }
    .list-item h3, .task-card h3 { margin: 0 0 6px; font-size: 16px; color: var(--text); }
    .task-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }
    .meta { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: var(--green-soft);
      color: var(--green);
      white-space: nowrap;
    }
    .task-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .task-actions .btn { width: auto; }
    .status { display: none; margin-top: 10px; padding: 12px 14px; border-radius: 18px; font-size: 14px; }
    .status.show { display: block; }
    .status.err { background: #fff0f0; color: var(--danger); }
    .status.ok { background: #e8f7f2; color: var(--ok); }
    .hidden { display: none !important; }
    .row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .user-line { margin: 0 4px; font-size: 13px; color: var(--muted); text-align: right; }
    .admin-main { display: flex; flex-direction: column; gap: 12px; }
    .logout-wrap { margin-top: 2px; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 365px) {
      .header h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="admin-app">
    <header class="header">
      <img class="header-banner" src="/images/admin-header-banner.png" width="1080" height="249" alt="مكاتب عقارية ذكية — منصة الفرص العقارية">
      <h1>إدارة المنصة</h1>
    </header>
    <main class="admin-main" id="app">
      <div class="card" id="loginCard">
        <h2>دخول مخصص لمدير المنصة فقط</h2>
        <form id="loginForm" class="toolbar">
          <div class="field">
            <label for="adminEmail">البريد الإلكتروني</label>
            <input id="adminEmail" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="adminPassword">كلمة المرور</label>
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn block" type="submit">دخول الإدارة</button>
        </form>
        <div id="status" class="status"></div>
      </div>
      <div id="console" class="hidden">
        <p class="user-line" id="adminUserLine">مرحبًا</p>
        <div class="tab-switch" id="mainNav"></div>
        <div id="viewRoot"></div>
        <div id="consoleStatus" class="status"></div>
        <div class="logout-wrap">
          <button class="btn secondary block" id="logoutBtn" type="button">تسجيل الخروج</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="/js/runtime-config.js"></script>
  <script type="module" src="/js/admin-console.js"></script>
</body>
</html>
