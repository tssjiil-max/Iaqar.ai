<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087064">
  <title>لوحة إدارة IAQAR.AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:#087064; --green-2:#128c7e; --bg:#f4f8f6; --card:#fff;
      --line:#dce8e4; --muted:#687c76; --text:#173d35; --danger:#9e3434;
      --warn:#c56612; --ok:#07634f;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Tajawal,Arial,sans-serif; }
    button { font:inherit; cursor:pointer; border:0; }
    .admin-app { min-height:100svh; padding:8px 10px calc(16px + env(safe-area-inset-bottom)); }
    .admin-shell { width:min(100%,720px); margin:auto; }
    .admin-header {
      background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:10px 12px; margin-bottom:8px; display:flex; align-items:center;
      justify-content:space-between; gap:8px;
    }
    .admin-brand h1 { margin:0; color:var(--green); font-size:17px; font-weight:800; line-height:1.2; }
    .admin-brand p { margin:2px 0 0; color:var(--muted); font-size:11px; line-height:1.3; }
    .admin-nav {
      display:flex; flex-wrap:nowrap; gap:6px; margin-bottom:8px; overflow-x:auto;
      -webkit-overflow-scrolling:touch; padding-bottom:2px;
    }
    .admin-nav button {
      flex:0 0 auto; padding:8px 10px; border-radius:10px; background:var(--card);
      border:1px solid var(--line); color:var(--green); font-weight:700; font-size:12px;
      white-space:nowrap;
    }
    .admin-nav button.active { background:var(--green-2); color:#fff; border-color:var(--green-2); }
    .admin-main { min-height:120px; }
    .admin-card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:8px; }
    .admin-card h2 { margin:0 0 8px; font-size:16px; color:var(--green); font-weight:700; }
    .admin-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
    .admin-grid-3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .counter {
      background:#eaf7f3; border-radius:12px; padding:10px 8px; border:1px solid #d4ebe4;
    }
    .counter.primary { background:linear-gradient(145deg,#eaf7f3,#dff3ec); border-color:#b8e0d4; }
    .counter strong { display:block; font-size:20px; color:var(--green); font-weight:800; line-height:1.1; }
    .counter span { display:block; font-size:11px; color:var(--muted); margin-top:4px; line-height:1.35; }
    .kpi-section { margin-bottom:10px; }
    .kpi-section h3 { margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:600; }
    .office-card { border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:8px; background:#fff; }
    .office-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
    .office-card h3 { margin:0; font-size:15px; font-weight:700; color:var(--text); line-height:1.35; }
    .office-meta { font-size:12px; color:var(--muted); line-height:1.55; }
    .badge-row { display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
    .badge { display:inline-block; padding:3px 8px; border-radius:999px; font-size:10px; font-weight:700; background:#eaf7f3; color:var(--ok); }
    .badge.warn { background:#fff1e5; color:var(--warn); }
    .badge.danger { background:#fff0f0; color:var(--danger); }
    .badge.muted { background:#f0f4f3; color:var(--muted); }
    .actions { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:10px; }
    .btn { padding:9px 10px; border-radius:10px; font-weight:700; font-size:12px; }
    .btn.primary { background:var(--green-2); color:#fff; }
    .btn.secondary { background:#fff; color:var(--green); border:1px solid var(--line); }
    .btn.danger { background:#fff0f0; color:var(--danger); border:1px solid #f3d4d4; }
    .btn-compact { padding:6px 10px; font-size:11px; }
    .filters { display:grid; gap:8px; margin-bottom:10px; }
    .filters input, .filters select, .filters textarea {
      width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:13px;
    }
    .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
    .tabs button { padding:7px 10px; border-radius:999px; background:#fff; border:1px solid var(--line); font-size:11px; font-weight:700; color:var(--green); }
    .tabs button.active { background:var(--green); color:#fff; }
    .status { margin:8px 0; padding:10px; border-radius:10px; font-size:13px; }
    .status.err { background:#fff0f0; color:var(--danger); }
    .status.ok { background:#e8f7f2; color:var(--ok); }
    .detail-section { margin-bottom:12px; }
    .detail-section h4 { margin:0 0 6px; font-size:13px; color:var(--green); font-weight:700; }
    .detail-row { font-size:12px; line-height:1.7; color:var(--muted); }
    .login-card { max-width:420px; margin:32px auto; }
    .empty-state { text-align:center; padding:20px 12px; color:var(--muted); font-size:13px; }
    .loading-block { text-align:center; padding:28px 12px; color:var(--muted); font-size:13px; }
    .loading-block::before {
      content:""; display:block; width:28px; height:28px; margin:0 auto 10px;
      border:3px solid #dce8e4; border-top-color:var(--green-2); border-radius:50%;
      animation:admin-spin .7s linear infinite;
    }
    @keyframes admin-spin { to { transform:rotate(360deg); } }
    .audit-action { font-size:14px; font-weight:700; color:var(--text); }
    .audit-tech { font-size:11px; color:var(--muted); }
    .hidden { display:none !important; }
    .admin-footer { margin-top:8px; }
    @media(min-width:600px){
      .admin-app { padding:12px 16px calc(20px + env(safe-area-inset-bottom)); }
      .admin-grid { grid-template-columns:repeat(4,1fr); }
      .admin-grid-3 { grid-template-columns:repeat(3,1fr); }
      .admin-nav { flex-wrap:wrap; overflow-x:visible; }
      .admin-nav button { flex:1 1 calc(33.33% - 6px); font-size:13px; }
    }
    @media(max-width:420px){ .admin-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="adminRoot" class="admin-app"></div>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="/__/firebase/init.js"></script>
  <script src="js/runtime-config.js"></script>
  <script src="js/admin-console.js"></script>
</body>
</html>
