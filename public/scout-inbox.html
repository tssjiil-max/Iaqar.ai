<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03677A">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>استقبال نتائج الباحث</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="preload" href="/fonts/noto-naskh-arabic/noto-naskh-arabic-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/os/os.css">
  <style>
    .inbox-page { max-width: 640px; margin: 0 auto; padding: 16px; }
    .inbox-page textarea { min-height: 220px; font-family: inherit; }
    .inbox-report li { margin: 2px 0; }
    .inbox-report .bad { color: var(--bad, #b42318); }
  </style>
</head>
<body>
  <main class="os-app inbox-page" data-scout-inbox>
    <div class="os-card os-form">
      <h1 class="os-h2">استقبال نتائج الباحث عن الفرص</h1>
      <p class="os-sub">للمساعد (Claude في المتصفح) أو الوسيط: الصق مفتاح المكتب ونتائج البحث ثم اضغط «إرسال». تُحفظ النتائج مباشرة في «الباحث عن الفرص» كفرص خارجية قيد المراجعة، ويُمنع التكرار تلقائيًا — لا حاجة لملف CSV.</p>
      <label class="os-field">
        <span>مفتاح الاستقبال</span>
        <input class="os-input" id="inbox-token" name="token" dir="ltr" autocomplete="off" spellcheck="false" placeholder="iqk.…" data-inbox-token>
      </label>
      <label class="os-pref-row"><span>تذكّر المفتاح على هذا الجهاز</span><input type="checkbox" id="inbox-remember" data-inbox-remember></label>
      <label class="os-field">
        <span>النتائج</span>
        <textarea class="os-textarea" id="inbox-paste" name="paste" spellcheck="false" data-inbox-paste placeholder='JSON: {"items":[{"url":"https://…","title":"…","text":"…","tx":"rent","propertyType":"شقة","city":"المدينة المنورة","district":"…","plan":"…","price":0,"area":0}]}  — أو نص: إعلان في كل فقرة، بينها سطر فارغ'></textarea>
        <small class="os-field-hint">حتى 20 إعلانًا في الدفعة (الأطول يُقسّم تلقائيًا). مواقع تمنع شروطها جمع إعلاناتها آليًا (عقار، حراج، بيوت، وصلت) تُرفض إلا باتفاقية بيانات مع المنصة.</small>
      </label>
      <button type="button" class="os-btn primary block" id="inbox-send" data-inbox-send>إرسال</button>
      <div class="os-alert" id="inbox-status" role="status" hidden data-inbox-status></div>
      <div id="inbox-report" class="inbox-report" data-inbox-report></div>
    </div>
  </main>
  <script src="/js/runtime-config.js"></script>
  <script type="module" src="/js/scout-inbox.js"></script>
</body>
</html>
