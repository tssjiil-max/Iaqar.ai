<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <script>
    // Old links keep working: party links, platform admin, cooperation and other
    // legacy deep links open the previous interface (public/legacy.html) unchanged.
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var legacyKeys = ["cv2Party", "adminApplications", "openBrokerApplication", "openCooperation", "openDeal",
          "openMessage", "openNotifications", "contentV2", "oppV2", "legacyContent", "cv2Ref", "session", "legacy", "shared"];
        var isLegacy = legacyKeys.some(function (key) { return params.has(key); })
          || params.get("office") === "platform" || /^\/add(\/|$)/.test(location.pathname);
        if (isLegacy) location.replace("/legacy.html" + location.search + location.hash);
      } catch (_) { /* keep loading the office app */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03677A">
  <meta name="description" content="مكتب عقاري ذكي — المهام اليومية والعروض والطلبات في مكان واحد.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="المكتب">
  <title>المكتب</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/iaqar-apple-touch-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/iaqar-default-icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="preload" href="/fonts/tajawal/tajawal-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/os/os.css">
  <link rel="stylesheet" href="/os/reference-layout.css">
  <link rel="stylesheet" href="/os/office-desk.css">
</head>
<body>
