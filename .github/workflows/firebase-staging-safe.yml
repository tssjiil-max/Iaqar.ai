name: Safe Firebase Staging Deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iaqar-staging-deployment
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: iaqar-ai-staging
      SOURCE_SHA: 549d6f05e614e161b6889ce1687abd8b667ee26b
    steps:
      - name: Checkout deployment tooling
        uses: actions/checkout@v4
        with:
          path: deploy-tools
      - name: Checkout reviewed blue office release
        uses: actions/checkout@v4
        with:
          ref: 549d6f05e614e161b6889ce1687abd8b667ee26b
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install release dependencies
        working-directory: app
        run: |
          npm ci
          npm ci --prefix worker
      - name: Validate release source and tests
        working-directory: app
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          npm test
          npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firestore tenant isolation in emulator
        working-directory: app
        run: npm run test:rules
      - name: Verify blue identity and office navigation
        working-directory: app
        run: |
          npx playwright install --with-deps chromium
          OUT_DIR="$RUNNER_TEMP/blue-office" node scripts/qa/office-os/office-focus.e2e.mjs
          OUT_DIR="$RUNNER_TEMP/blue-identity" node scripts/qa/office-os/design-icons.e2e.mjs
      - name: Prepare and verify isolated staging build
        run: node deploy-tools/scripts/prepare-blue-staging.mjs app
      - name: Authenticate to staging with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: iaqar-ai-staging
          workload_identity_provider: projects/1010507631812/locations/global/workloadIdentityPools/github-staging/providers/github
          service_account: github-staging-deploy@iaqar-ai-staging.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy hosting and rules to staging only
        working-directory: app
        run: npx firebase-tools deploy --project iaqar-ai-staging --only hosting,firestore:rules,firestore:indexes --non-interactive
