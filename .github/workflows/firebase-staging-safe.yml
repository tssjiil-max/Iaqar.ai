name: Safe Firebase Staging Deployment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iaqar-staging-deployment
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: iaqar-ai-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate basic JavaScript and fixture tests
        run: |
          node --check public/js/access-gate.js
          node --check worker/src/index.js
          node --test tests/public-intake-fixtures.test.mjs
      - name: Prepare isolated staging frontend
        run: node scripts/prepare-firebase-staging.mjs
      - name: Block mixed staging/production traffic
        run: node scripts/preflight-firebase-staging.mjs
      - name: Authenticate to staging with OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: iaqar-ai-staging
          workload_identity_provider: projects/1010507631812/locations/global/workloadIdentityPools/github-staging/providers/github
          service_account: github-staging-deploy@iaqar-ai-staging.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy hosting and rules to staging only
        run: |
          npx --yes firebase-tools deploy --project iaqar-ai-staging --only hosting,firestore:rules,firestore:indexes --non-interactive
