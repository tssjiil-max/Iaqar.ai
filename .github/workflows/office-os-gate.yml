name: Office OS gate

on:
  push:
    branches:
      - claude/office-os-rebuild-20260930
  pull_request:
    branches:
      - codex/unified-staging-lineage-2026-08-29
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-os-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-check:
    name: Unit + Worker tests + syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Web + Worker tests (includes office-os domain, journey, security suites)
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
      - name: Report failing tests as annotations
        if: always()
        run: node scripts/qa/office-os/annotate-tap.mjs "$RUNNER_TEMP/npm-test.log"
      - run: npm run check

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Rules emulator suites (existing + office-os)
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee "$RUNNER_TEMP/rules.log"
      - name: Report rules results as annotations
        if: always()
        run: node scripts/qa/office-os/annotate-tap.mjs "$RUNNER_TEMP/rules.log"

  new-app-browser:
    name: New app in a real browser (journey, widths, deep links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npx playwright install --with-deps chromium
      - name: Full journey on public/index.html + r.html
        run: OUT_DIR="$RUNNER_TEMP/office-os/journey" node scripts/qa/office-os/journey.e2e.mjs
      - name: Phone widths 320/360/375/390/412/430
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/widths" node scripts/qa/office-os/mobile-widths.e2e.mjs
      - name: Legacy links and deep links
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/links" node scripts/qa/office-os/deep-links.e2e.mjs
      - name: Office settings
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/settings" node scripts/qa/office-os/settings.e2e.mjs
      - name: Brokers community
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/community" node scripts/qa/office-os/community.e2e.mjs
      - name: Fresh broker onboarding (office, logout/login, offer, request, match, task)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/fresh-broker" node scripts/qa/office-os/fresh-broker.e2e.mjs
      - name: Login screen flows (forgot password, broker application, public footer entry)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/auth-flows" node scripts/qa/office-os/auth-flows.e2e.mjs
      - name: Office library (folders, upload, download, edit, delete, member rights)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/library" node scripts/qa/office-os/library.e2e.mjs
      - name: Negotiation room (three parts, terms per property, requests to the broker, live between the sides)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/session" node scripts/qa/office-os/session.e2e.mjs
      - name: Office completion (header, tools, deal path, records, photos, documents, channels, inbox, search, audit)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/completion" node scripts/qa/office-os/completion.e2e.mjs
      - name: Broker steps (one card per deal, «متابعة الصفقة», both contact paths, notifications, search, library link)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/broker-steps" node scripts/qa/office-os/broker-steps.e2e.mjs
      - name: Office bot on Telegram (switch, links, asking the two sides, opening the deal, taking it back)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/bot" node scripts/qa/office-os/bot.e2e.mjs
      - name: «مدير المكتب الذكي» in a real browser (home card = Daily Tasks lanes, chat, settings)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/agent" node scripts/qa/office-os/agent.e2e.mjs
      - name: «جرّب مدير مكتبك» — the owner's and the client's try-outs (slow network, fast presses, 320/390 px)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/agent-try" node scripts/qa/office-os/agent-try.e2e.mjs
      - name: «تعبئة ذكية | تعبئة يدوية» + «إضافة سريعة» (public page and office, isolation, limits)
        if: always()
        run: OUT_DIR="$RUNNER_TEMP/office-os/smart-fill" node scripts/qa/office-os/smart-fill.e2e.mjs
      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-os-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/office-os
          retention-days: 14
