name: Office OS preview (Staging project, isolated)

# Pre-merge preview of PR #131. Deploys ONLY:
#   - Firebase Hosting channel "office-os-preview" on iaqar-ai-staging (not the "staging" channel)
#   - Cloudflare Worker "iaqar-intake-os-preview" (wrangler --env preview, not --env staging)
# Production (aqar-b5d76, production Worker) and the shared Staging channel/Worker are untouched.
on:
  push:
    branches:
      - claude/office-os-rebuild-20260930
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-os-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy preview + live journey
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write   # only to push the per-run evidence branch qa/office-os-preview-<run>
    env:
      IAQAR_DEPLOY_TARGET: preview
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Deploy preview (channel + preview Worker)
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          PREVIEW_OUTPUT_FILE="$GITHUB_ENV" bash scripts/deploy-office-os-preview.sh
      - name: Preview links
        run: |
          echo "### Office OS preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: ${PREVIEW_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public office page (QA office): ${PREVIEW_URL}/?office=qa-office-os-preview&view=public" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: ${PREVIEW_WORKER_URL}/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=preview URL::${PREVIEW_URL} (worker ${PREVIEW_WORKER_URL}, commit ${GITHUB_SHA})"
      - run: npx playwright install --with-deps chromium
      - name: Live journey on the preview (isolated QA office)
        run: OUT_DIR="$RUNNER_TEMP/office-os-live" node scripts/qa/office-os/live-preview.e2e.mjs
      - name: Live results summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/office-os-live/live-report.json" ]; then
            node -e 'const r=require(process.argv[1]);const ok=r.checks.filter(c=>c.ok).length;console.log(`- Live checks: ${ok}/${r.checks.length}`);for(const c of r.checks.filter(c=>!c.ok))console.log(`  - FAIL: ${c.name} — ${c.detail}`);console.log(`- FCM: ${JSON.stringify(r.fcm)}`);console.log(`- Gemini: ${JSON.stringify(r.gemini)}`)' "$RUNNER_TEMP/office-os-live/live-report.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      # QA branch for PR #262 + #263 only (not part of either PR): the check that failed on Staging run
      # 40057732450 — «العروض والطلبات» → «مراجعة التطابق» on both sides, another match, after refresh —
      # against this preview, five times in a row. Dedicated QA office, run-scoped fixtures, removed after.
      - name: «العروض والطلبات» → «مراجعة التطابق» on the preview, 5 runs (PR #262 + #263)
        if: ${{ !cancelled() }}
        run: |
          failed=0
          for i in 1 2 3 4 5; do
            if STAGING_HOSTING_URL="$PREVIEW_URL" SCREENSHOT_DIR="$RUNNER_TEMP/bank-preview/run-$i" node scripts/staging-bank-card-click-verify.mjs > "$RUNNER_TEMP/bank-preview-run-$i.log" 2>&1; then
              echo "run $i: PASS"
            else
              echo "run $i: FAIL"; failed=$((failed+1)); tail -40 "$RUNNER_TEMP/bank-preview-run-$i.log"
            fi
          done
          echo "- «العروض والطلبات» → «مراجعة التطابق»: $((5-failed))/5 runs passed" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/bank-preview" && cp "$RUNNER_TEMP"/bank-preview-run-*.log "$RUNNER_TEMP/bank-preview/" || true
          [ "$failed" -eq 0 ]
      - name: Upload «العروض والطلبات» preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/bank-preview
          if-no-files-found: warn
          retention-days: 14
      - name: «الاستقبال التلقائي» live proof on the preview (isolated QA offices)
        if: ${{ !cancelled() }}
        run: OUT_DIR="$RUNNER_TEMP/scout-ingest-live" node scripts/qa/office-os/scout-ingest-live.e2e.mjs
      - name: Upload «الاستقبال التلقائي» evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-ingest-live-${{ github.run_id }}
          path: ${{ runner.temp }}/scout-ingest-live
          retention-days: 14
      - name: Upload live screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-os-live-${{ github.run_id }}
          path: ${{ runner.temp }}/office-os-live
          retention-days: 14
      - name: Publish live evidence to a per-run QA branch
        if: always()
        run: |
          D="$RUNNER_TEMP/office-os-live"
          [ -d "$D" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan office-os-evidence
          git rm -rq --cached .
          mkdir -p evidence
          cp "$D"/* evidence/
          printf 'commit %s\nrun %s\npreview %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "${PREVIEW_URL:-}" > evidence/RUN.txt
          git add -f evidence
          git commit -qm "Office OS live preview evidence for ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q origin "HEAD:refs/heads/qa/office-os-preview-${GITHUB_RUN_ID}"
          echo "::notice title=live evidence branch::qa/office-os-preview-${GITHUB_RUN_ID}"
