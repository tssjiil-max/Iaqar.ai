name: Live MATCH_REVIEW staging diagnostic

on:
  push:
    branches:
      - diagnostic/live-match-review-20260918
    paths:
      - .github/run-live-match-review-diagnostic.trigger

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run read-only staging diagnostic
        run: node scripts/live-match-review-diagnostic-20260918.mjs
