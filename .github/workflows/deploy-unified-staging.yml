name: Deploy unified staging

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unified-staging-lineage-2026-08-29

permissions:
  contents: read

concurrency:
  group: iaqar-unified-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/codex/unified-staging-lineage-2026-08-29'
    runs-on: ubuntu-latest
    environment: staging
    env:
      IAQAR_DEPLOY_TARGET: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout unified staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/unified-staging-lineage-2026-08-29
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Deploy and verify Staging only
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npm run deploy:staging:safe

      - name: Verify live Match to Daily Tasks path
        run: |
          npx playwright install --with-deps chromium
          LIVE_E2E_OUT="$RUNNER_TEMP/match-review-live-qa" node scripts/live-match-integrity-qa.mjs

      - name: Verify live negotiation session path
        run: |
          LIVE_E2E_OUT="$RUNNER_TEMP/negotiation-live-qa" node scripts/live-negotiation-session-qa.mjs

      - name: Upload live negotiation E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negotiation-live-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/negotiation-live-qa
          if-no-files-found: warn
          retention-days: 7
