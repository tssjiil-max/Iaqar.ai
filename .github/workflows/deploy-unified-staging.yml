name: Deploy unified staging

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unified-staging-lineage-2026-08-29

permissions:
  contents: read

concurrency:
  group: iaqar-unified-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/codex/unified-staging-lineage-2026-08-29'
    runs-on: ubuntu-latest
    environment: staging
    env:
      IAQAR_DEPLOY_TARGET: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout unified staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/unified-staging-lineage-2026-08-29
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Deploy and verify Staging only
        env:
          IAQAR_DEPLOY_DIAGNOSTIC_FILE: ${{ runner.temp }}/iaqar-staging-deploy-diagnostic.txt
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npm run deploy:staging:safe

      - name: Upload staging deploy failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deploy-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/iaqar-staging-deploy-diagnostic.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Diagnose thamer Match to Daily Tasks
        run: |
          mkdir -p "$RUNNER_TEMP/thamer-match-diagnostic"
          node scripts/diagnose-thamer-match-daily-task.mjs | tee "$RUNNER_TEMP/thamer-match-diagnostic/report.json"

      - name: Upload thamer Match diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thamer-match-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/thamer-match-diagnostic/report.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify Bank operational action opens Operations Center
        run: |
          npx playwright install --with-deps chromium
          SCREENSHOT_DIR="$RUNNER_TEMP/bank-operation-live-qa" node scripts/staging-bank-card-click-verify.mjs

      - name: Upload Bank operational navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-operation-live-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/bank-operation-live-qa
          if-no-files-found: warn
          retention-days: 7

      - name: Verify live Match to Daily Tasks path
        run: |
          npx playwright install --with-deps chromium
          LIVE_E2E_OUT="$RUNNER_TEMP/match-review-live-qa" node scripts/live-match-integrity-qa.mjs

      - name: Verify live negotiation session path
        run: |
          LIVE_E2E_OUT="$RUNNER_TEMP/negotiation-live-qa" node scripts/live-negotiation-session-qa.mjs

      - name: Upload live negotiation E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negotiation-live-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/negotiation-live-qa
          if-no-files-found: warn
          retention-days: 7

      - name: Verify one fresh Match lineage end to end
        run: |
          LIVE_E2E_OUT="$RUNNER_TEMP/fresh-match-lineage-qa" node scripts/staging-fresh-match-lineage-verify.mjs

      - name: Upload fresh Match lineage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-match-lineage-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/fresh-match-lineage-qa
          if-no-files-found: warn
          retention-days: 7
