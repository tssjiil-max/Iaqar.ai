name: Deploy unified staging

on:
  workflow_dispatch:
  push:
    branches:
      - codex/unified-staging-lineage-2026-08-29

permissions:
  contents: read

concurrency:
  group: iaqar-unified-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/codex/unified-staging-lineage-2026-08-29'
    runs-on: ubuntu-latest
    environment: staging
    env:
      IAQAR_DEPLOY_TARGET: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout unified staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/unified-staging-lineage-2026-08-29
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Deploy and verify Staging only
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          npm run deploy:staging:safe

      - name: Verify live Match to Daily Tasks path
        run: |
          npx playwright install --with-deps chromium
          LIVE_E2E_OUT="$RUNNER_TEMP/match-review-live-qa" node scripts/live-match-integrity-qa.mjs

      - name: Verify live negotiation session path
        run: |
          export LIVE_E2E_OUT="$RUNNER_TEMP/negotiation-live-qa"
          export CHROME_PATH="$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          sudo mkdir -p /workspace/qa
          sudo chown "$USER":"$USER" /workspace/qa
          node scripts/live-staging-core-flow.mjs

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import path from 'node:path';

          const reportPath = path.join(process.env.LIVE_E2E_OUT, 'live-core-flow-report.json');
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          const http = Array.isArray(report.http) ? report.http : [];
          const mintRows = http.filter((row) => {
            if (String(row.method || '').toUpperCase() !== 'POST') return false;
            try {
              return new URL(row.url).pathname.replace(/\/+$/, '') === '/party/sessions';
            } catch {
              return false;
            }
          });
          const partyTokens = new Set();
          for (const row of http) {
            try {
              const match = new URL(row.url).pathname.match(/\/party\/sessions\/([a-f0-9]{32,128})(?:\/|$)/i);
              if (match) partyTokens.add(match[1]);
            } catch {
              // Ignore malformed/non-URL log rows.
            }
          }

          if (!report.coreFlowVerified) {
            throw new Error('live negotiation core flow was not verified');
          }
          if (mintRows.length !== 2) {
            throw new Error(`expected exactly 2 party-session mints (client + owner), got ${mintRows.length}`);
          }
          if (partyTokens.size !== 2) {
            throw new Error(`expected exactly 2 stable party tokens (client + owner), got ${partyTokens.size}`);
          }
          console.log(`LIVE_PARTY_TOKEN_STABILITY_OK mints=${mintRows.length} tokens=${partyTokens.size}`);
          NODE

      - name: Upload live negotiation E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: negotiation-live-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/negotiation-live-qa
          if-no-files-found: warn
          retention-days: 7
