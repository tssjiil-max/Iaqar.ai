name: Apply validated matchId push patch v2

on:
  push:
    branches:
      - codex/apply-matchid-push-helper-20260924

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target staging branch
        uses: actions/checkout@v4
        with:
          ref: codex/unified-staging-lineage-2026-08-29
          fetch-depth: 0

      - name: Guard exact target commit
        run: |
          test "$(git rev-parse HEAD)" = "e9d41d7c7c6e3d1c604d299e16fc3702bf44c6f4"

      - name: Apply exact validated patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          worker = Path('worker/src/index.js')
          text = worker.read_text(encoding='utf-8')
          needle = '      opportunityId: top.opportunityId || top.clientRequestId || top.requestId || "",\n      assignedBrokerId: top.assignedBrokerId || "",\n'
          replacement = '      opportunityId: top.opportunityId || top.clientRequestId || top.requestId || "",\n      matchId: top.matchId,\n      assignedBrokerId: top.assignedBrokerId || "",\n'
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one worker patch location, got {text.count(needle)}')
          worker.write_text(text.replace(needle, replacement, 1), encoding='utf-8')

          test_b64 = ''
          Path('test/match-push-deep-link.test.mjs').write_bytes(base64.b64decode(test_b64))
          PY

      - name: Verify exact blobs and regression test
        run: |
          WORKER_SHA="$(git hash-object worker/src/index.js)"
          TEST_SHA="$(git hash-object test/match-push-deep-link.test.mjs)"
          case "$WORKER_SHA" in 4de8f7a*) ;; *) echo "unexpected worker blob: $WORKER_SHA"; exit 1;; esac
          test "$TEST_SHA" = "f64aeffada07fbb591ce76ae17a519b9c925c980"
          git add -N test/match-push-deep-link.test.mjs
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "test/match-push-deep-link.test.mjs worker/src/index.js "
          git diff --check
          node --test test/match-push-deep-link.test.mjs

      - name: Commit exact patch to target branch without triggering deployment
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add worker/src/index.js test/match-push-deep-link.test.mjs
          git commit -m "Preserve match ID in staging match push deep links [skip ci]"
          git push origin HEAD:codex/unified-staging-lineage-2026-08-29
