name: Claude npm-test diagnostic

on:
  push:
    branches:
      - codex/unified-staging-lineage-2026-08-29
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-staging-lineage-2026-08-29
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Run npm test, capture output regardless of outcome
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/npm-test-output.txt || true
      - name: Publish output via git (blob storage artifact host is blocked from the review sandbox)
        if: always()
        run: |
          mkdir -p qa-evidence
          grep -n "^not ok\|^# fail\|^# tests\|^# pass" /tmp/npm-test-output.txt > qa-evidence/npm-test-summary.txt || true
          cp /tmp/npm-test-output.txt qa-evidence/npm-test-output.txt
          git config user.name "claude-ci-evidence"
          git config user.email "actions@users.noreply.github.com"
          git add -f qa-evidence/npm-test-output.txt
          git commit -m "ci: publish npm test output for diagnosis [skip ci]" || echo "nothing to commit"
          git push origin HEAD:codex/unified-staging-lineage-2026-08-29
