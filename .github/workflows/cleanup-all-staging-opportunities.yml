name: Temporary cleanup all staging opportunities

on:
  push:
    branches:
      - codex/unified-staging-lineage-2026-08-29

permissions:
  contents: read

jobs:
  cleanup-staging-opportunities:
    if: contains(github.event.head_commit.message, '[staging-data-cleanup]')
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Count, delete OFFER and REQUEST, then verify
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import * as admin from "firebase-admin";
          import { getFirestore } from "firebase-admin/firestore";
          import { parseFirebaseServiceAccountJson } from "./scripts/staging-credentials.mjs";

          const PROJECT_ID = "iaqar-ai-staging";
          const parsed = parseFirebaseServiceAccountJson(process.env.FIREBASE_SERVICE_ACCOUNT_JSON, PROJECT_ID);
          if (!parsed.serviceAccount) throw new Error("Missing or invalid staging service account");
          if (parsed.serviceAccount.project_id !== PROJECT_ID) throw new Error("Refusing non-staging Firebase project");

          const app = admin.initializeApp({
            credential: admin.cert(parsed.serviceAccount),
            projectId: PROJECT_ID
          });
          const db = getFirestore(app);
          const officesBefore = await db.collection("offices").get();
          const usersBefore = await db.collection("users").get();
          if (officesBefore.empty) throw new Error("Safety stop: no offices found");

          const targets = [];
          let offersBefore = 0;
          let requestsBefore = 0;
          for (const officeDoc of officesBefore.docs) {
            const opportunities = await officeDoc.ref.collection("opportunities").get();
            let offers = 0;
            let requests = 0;
            for (const doc of opportunities.docs) {
              const kind = String(doc.data()?.opportunityKind || "").trim().toUpperCase();
              if (kind === "OFFER") {
                offers += 1;
                offersBefore += 1;
                targets.push({ ref: doc.ref, kind });
              } else if (kind === "REQUEST") {
                requests += 1;
                requestsBefore += 1;
                targets.push({ ref: doc.ref, kind });
              }
            }
            console.log(`BEFORE officeId=${officeDoc.id} OFFERS=${offers} REQUESTS=${requests}`);
          }
          console.log(`BEFORE TOTAL OFFERS=${offersBefore} TOTAL REQUESTS=${requestsBefore}`);

          for (let offset = 0; offset < targets.length; offset += 400) {
            const batch = db.batch();
            for (const target of targets.slice(offset, offset + 400)) batch.delete(target.ref);
            await batch.commit();
          }

          const officesAfter = await db.collection("offices").get();
          const usersAfter = await db.collection("users").get();
          let offersAfter = 0;
          let requestsAfter = 0;
          for (const officeDoc of officesAfter.docs) {
            const opportunities = await officeDoc.ref.collection("opportunities").get();
            for (const doc of opportunities.docs) {
              const kind = String(doc.data()?.opportunityKind || "").trim().toUpperCase();
              if (kind === "OFFER") offersAfter += 1;
              if (kind === "REQUEST") requestsAfter += 1;
            }
          }

          const officesPreserved = officesAfter.size === officesBefore.size;
          const usersPreserved = usersAfter.size === usersBefore.size;
          console.log(`OFFERS DELETED=${offersBefore}`);
          console.log(`REQUESTS DELETED=${requestsBefore}`);
          console.log(`TOTAL OFFERS=${offersAfter}`);
          console.log(`TOTAL REQUESTS=${requestsAfter}`);
          console.log(`OFFICES STILL EXIST=${officesPreserved ? "YES" : "NO"} BEFORE=${officesBefore.size} AFTER=${officesAfter.size}`);
          console.log(`USERS STILL EXIST=${usersPreserved ? "YES" : "NO"} BEFORE=${usersBefore.size} AFTER=${usersAfter.size}`);

          await app.delete();
          if (offersAfter !== 0 || requestsAfter !== 0 || !officesPreserved || !usersPreserved) {
            process.exit(2);
          }
          NODE
