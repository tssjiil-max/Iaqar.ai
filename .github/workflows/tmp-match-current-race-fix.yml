name: TEMP match current race fix

on:
  push:
    branches:
      - fix/match-current-race-20260918

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/match-current-race-20260918
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Worker dependencies
        run: npm install --prefix worker --ignore-scripts

      - name: RED - reproduce pairRule current race
        shell: bash
        run: |
          set +e
          node worker/test/match-current-race.test.mjs
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix"
            exit 1
          fi
          echo "RED confirmed: current-match race regression test fails on old implementation"

      - name: Apply isolated CAS fix
        run: node scripts/tmp-apply-match-current-race-fix.mjs

      - name: GREEN - concurrent current match regression
        run: node worker/test/match-current-race.test.mjs

      - name: Verify Worker test suite
        run: npm test --prefix worker

      - name: Commit verified fix and remove temporary machinery
        shell: bash
        run: |
          rm -f scripts/tmp-apply-match-current-race-fix.mjs
          rm -f .github/workflows/tmp-match-current-race-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: serialize current match claims per pair rule"
          git push origin HEAD:fix/match-current-race-20260918
