name: Temporary staging office read-only diagnostic
on:
  push:
    branches:
      - tmp/diag-thamer-match-2026-09-14
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 8
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect latest live match shape
        run: node scripts/tmp-inspect-latest-match-shape.mjs | tee "$RUNNER_TEMP/latest-match-shape.json"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-match-shape-${{ github.run_id }}
          path: ${{ runner.temp }}/latest-match-shape.json
          if-no-files-found: warn
          retention-days: 2
