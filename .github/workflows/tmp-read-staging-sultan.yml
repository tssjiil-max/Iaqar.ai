name: Temporary staging patch verification
on:
  push:
    branches:
      - tmp/diag-thamer-match-2026-09-14
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: node --check public/js/opportunity-action-projection-domain.js
      - name: Focused regression tests
        run: node --test test/opportunity-action-projection-domain.test.mjs test/opportunity-bank-stability.test.mjs
