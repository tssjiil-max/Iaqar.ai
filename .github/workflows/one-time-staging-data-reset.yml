name: One-time staging data reset

on:
  push:
    branches:
      - codex/unified-staging-lineage-2026-08-29
    paths:
      - .github/workflows/one-time-staging-data-reset.yml

permissions:
  contents: read

jobs:
  reset-staging-data:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-staging-lineage-2026-08-29
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reset opportunity-cycle data on Staging only
        run: node scripts/reset-staging-office-opportunities.mjs --apply --confirm=RESET_STAGING_OPPORTUNITIES
