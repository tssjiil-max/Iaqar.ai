name: TEMP coordination negotiation gate fix

on:
  push:
    branches:
      - fix/coordination-negotiation-gate-20260918

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/coordination-negotiation-gate-20260918
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: RED - prove regression test catches old ordering
        run: |
          set +e
          node worker/test/workflow-negotiation-gate.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix"
            exit 1
          fi
          echo "Regression test failed as expected before the fix"

      - name: Apply isolated coordinationSessions-first fix
        run: node scripts/tmp-apply-coordination-negotiation-fix.mjs

      - name: GREEN - run isolated regression test
        run: node worker/test/workflow-negotiation-gate.test.mjs

      - name: Verify Worker test suite
        run: npm test --prefix worker

      - name: Commit verified fix and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-coordination-negotiation-fix.yml scripts/tmp-apply-coordination-negotiation-fix.mjs
          git add worker/src/index.js worker/package.json worker/test/workflow-negotiation-gate.test.mjs
          git diff --cached --check
          git commit -m "fix: gate negotiation from coordination session"
          git push origin HEAD:fix/coordination-negotiation-gate-20260918
