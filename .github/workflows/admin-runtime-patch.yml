name: Admin runtime patch

on:
  push:
    branches:
      - chore/admin-separation-phase11-20260907

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/admin-separation-phase11-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Wire strict admin control plane
        shell: python
        run: |
          from pathlib import Path

          p = Path('worker/src/index.js')
          s = p.read_text()
          admin_import = 'import { assertPlatformAdminClaims } from "./admin-control-plane-domain.js";\n'
          anchor = 'import {\n  createAdminHelpers,\n'
          if admin_import not in s:
            if anchor not in s: raise SystemExit('admin-service import anchor missing')
            s = s.replace(anchor, admin_import + anchor, 1)
          s = s.replace(
            '  handleAdminAuditLog,\n',
            '  handleAdminAuditLog,\n  handleAdminSession,\n',
            1
          )
          old = '''  if (requireAdmin && claims.platformAdmin !== true && claims.admin !== true) {\n    throw appError("admin_required", 403, "هذه العملية خاصة بإدارة المنصة");\n  }'''
          new = '''  if (requireAdmin) {\n    const authorization = assertPlatformAdminClaims(claims);\n    if (!authorization.ok) {\n      throw appError("admin_required", 403, "هذه العملية خاصة بإدارة المنصة");\n    }\n  }'''
          if old not in s and 'assertPlatformAdminClaims(claims)' not in s:
            raise SystemExit('platform identity boundary anchor missing')
          s = s.replace(old, new, 1)
          route_anchor = '''      if (request.method === "GET" && url.pathname === "/admin/overview") {\n        return await handleAdminOverview(request, env, requestId, getAdminHelpers());\n      }'''
          session_route = '''      if (request.method === "GET" && url.pathname === "/admin/session") {\n        return await handleAdminSession(request, env, requestId, getAdminHelpers());\n      }\n\n'''
          if '/admin/session' not in s:
            if route_anchor not in s: raise SystemExit('admin overview route anchor missing')
            s = s.replace(route_anchor, session_route + route_anchor, 1)
          p.write_text(s)

          p = Path('worker/src/admin-service.js')
          s = p.read_text()
          session_fn = '''export async function handleAdminSession(request, env, requestId, helpers) {\n  helpers.assertFirebaseSecrets(env);\n  const claims = await helpers.requirePlatformIdentity(request, env, true);\n  return helpers.jsonResponse({\n    ok: true,\n    admin: {\n      uid: String(claims.sub || claims.user_id || ""),\n      email: String(claims.email || ""),\n      platformAdmin: true\n    },\n    requestId\n  });\n}\n\n'''
          marker = 'export async function handleAdminOverview(request, env, requestId, helpers) {'
          if 'export async function handleAdminSession' not in s:
            if marker not in s: raise SystemExit('admin overview function anchor missing')
            s = s.replace(marker, session_fn + marker, 1)
          p.write_text(s)

          p = Path('public/js/admin-api.js')
          s = p.read_text()
          if 'session() { return this.request("/admin/session"); }' not in s:
            marker = '  overview() { return this.request("/admin/overview"); }'
            if marker not in s: raise SystemExit('admin api overview anchor missing')
            s = s.replace(marker, '  session() { return this.request("/admin/session"); }\n' + marker, 1)
          p.write_text(s)

          p = Path('public/js/admin-console.js')
          s = p.read_text()
          start = s.find('async function ensurePlatformAdmin(user) {')
          if start >= 0:
            end = s.find('\n}\n\nfunction renderMainNav()', start)
            if end < 0: raise SystemExit('ensurePlatformAdmin end anchor missing')
            s = s[:start] + s[end + 3:]
          s = s.replace(
            'async function enterConsole(user) {\n  await ensurePlatformAdmin(user);\n',
            'async function enterConsole(user) {\n  const session = await api.session();\n  const admin = session.admin || {};\n',
            1
          )
          s = s.replace(
            '  els.adminUserLine.textContent = `مرحبًا ${user.email || "مدير المنصة"}`;',
            '  els.adminUserLine.textContent = `مرحبًا ${admin.email || user.email || "مدير المنصة"}`;',
            1
          )
          if 'getIdTokenResult' in s or 'claims.admin' in s:
            raise SystemExit('browser still trusts admin token claims')
          if 'await api.session()' not in s:
            raise SystemExit('admin console session verification not wired')
          p.write_text(s)

          p = Path('package.json')
          s = p.read_text()
          if '"test:admin:gate"' not in s:
            marker = '    "test:notifications:gate": "node --test test/notifications-cleanup-phase10.test.mjs test/notification-deep-link.test.mjs test/notification-preferences.test.mjs test/operations-phase5.test.mjs test/central-orchestrator-cleanup-phase9.test.mjs",\n'
            if marker not in s: raise SystemExit('package notifications gate anchor missing')
            s = s.replace(marker, marker + '    "test:admin:gate": "node --test test/admin-separation-phase11.test.mjs test/admin-console.test.mjs",\n', 1)
          p.write_text(s)

      - name: Validate admin separation
        run: |
          node --check worker/src/admin-control-plane-domain.js
          node --check worker/src/admin-service.js
          node --check worker/src/index.js
          node --check public/js/admin-api.js
          node --check public/js/admin-console.js
          npm run test:admin:gate
      - name: Commit admin separation runtime
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/src/admin-service.js public/js/admin-api.js public/js/admin-console.js package.json
          git commit -m "Admin: enforce platform-only server control plane"
          git push origin HEAD:chore/admin-separation-phase11-20260907
