name: Matching release gate

on:
  push:
    branches:
      - chore/matching-release-gate-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matching-gate:
    name: matching-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Run matching release gate
        run: npm run test:matching:gate

  worker-tests:
    name: worker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker dependencies
        run: npm ci --prefix worker
      - name: Run worker tests
        run: npm test --prefix worker

  root-tests:
    name: root-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix worker
      - name: Run root web tests
        run: npm run test:web

  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix worker
      - name: Run static checks
        run: npm run check
