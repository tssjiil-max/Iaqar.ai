name: Diagnose thamer match read only

on:
  push:
    branches:
      - diagnostic/thamer-match-readonly-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_STAGING_PROJECT_ID: iaqar-ai-staging
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/thamer-match-readonly-20260910

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare read-only staging credentials
        run: |
          node scripts/staging-gac.mjs "/tmp/iaqar-staging-gac.json" "/tmp/iaqar-staging-secret-files"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/iaqar-staging-gac.json" >> "$GITHUB_ENV"

      - name: Diagnose thamer latest real match
        run: node scripts/diagnose-thamer-match-readonly.mjs
