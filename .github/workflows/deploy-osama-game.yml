name: Deploy Osama Game (Web)

on:
  push:
    branches:
      - cursor/osama-nattah-game-c0aa
    paths:
      - 'docs/osama-game/**'
      - '.github/workflows/deploy-osama-game.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-osama-game
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/osama-game

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
