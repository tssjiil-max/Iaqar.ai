name: Completion runtime patch

on:
  push:
    branches:
      - chore/full-e2e-regression-phase12-20260907

permissions:
  contents: write

jobs:
  patch-completion-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/full-e2e-regression-phase12-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Validate completion service before wiring
        run: |
          node --check worker/src/data-completion-runtime-service.js
          node --check public/js/data-completion-page.js
          node --test test/data-completion-runtime-phase12.test.mjs
      - name: Wire Data Completion routes
        run: python scripts/patch-completion-runtime-phase12.py
      - name: Validate wired completion runtime
        run: |
          node --check worker/src/index.js
          node --check worker/src/data-completion-runtime-service.js
          node --check public/js/data-completion-page.js
          npm run test:completion:gate
          npm run test:orchestrator:gate
          npm run test:matching:gate
      - name: Commit completion runtime
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js package.json
          git commit -m "Completion: wire persistent server runtime"
          git push origin HEAD:chore/full-e2e-regression-phase12-20260907
