name: Serper Staging activation
on:
  push:
    branches: [codex/serper-staging-20261011]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iaqar-unified-staging
  cancel-in-progress: false
jobs:
  activate:
    if: github.ref == 'refs/heads/codex/serper-staging-20261011'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm ci --prefix worker
      - run: npm test && npm run check
      - name: Activate only Staging Worker with its Serper secret
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY_STAGING }}
        run: |
          set -euo pipefail
          test -n "$SERPER_API_KEY"
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          test "$CLOUDFLARE_ACCOUNT_ID" = '66b8fc5b9d25b9ed0f3177d6b8160fad'
          printf '%s' "$SERPER_API_KEY" | npx wrangler secret put SERPER_API_KEY --env staging
          npx wrangler deploy --env staging --keep-vars
      - name: Real Serper query through the Staging scout
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          OUT_DIR: ${{ runner.temp }}/serper-evidence
        run: node scripts/qa/office-os/serper-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serper-staging-evidence
          path: ${{ runner.temp }}/serper-evidence
          if-no-files-found: warn
