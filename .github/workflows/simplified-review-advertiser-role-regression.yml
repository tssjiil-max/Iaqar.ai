name: Unified advertiser-role regression

on:
  push:
    branches:
      - fix/simplified-review-advertiser-role-20260918

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run focused unified-review regression
        run: node --test test/simplified-review-advertiser-role.test.mjs
