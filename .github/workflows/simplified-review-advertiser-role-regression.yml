name: Unified advertiser-role regression

on:
  push:
    branches:
      - fix/simplified-review-advertiser-role-20260918

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused regressions
        run: node --test test/simplified-review-advertiser-role.test.mjs test/add-opportunity-approved-readiness.test.mjs
      - name: Full test suite
        run: npm test
      - name: Matching gate
        run: npm run test:matching:gate
      - name: Post-match gate
        run: npm run test:post-match:gate
      - name: Daily tasks gate
        run: npm run test:daily-tasks:gate
      - name: Completion gate
        run: npm run test:completion:gate
      - name: Static checks
        run: npm run check
