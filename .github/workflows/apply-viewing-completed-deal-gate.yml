name: Apply Viewing Completed Deal Gate

on:
  push:
    branches:
      - fix/viewing-completed-deal-gate-20260908
    paths:
      - scripts/apply-viewing-completed-deal-gate.mjs
      - .github/workflows/apply-viewing-completed-deal-gate.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply guarded patch
        run: node scripts/apply-viewing-completed-deal-gate.mjs

      - name: Rebuild Content V2 public mirror
        run: npm run v2:content

      - name: Install dependencies
        run: npm ci

      - name: Viewing release gate
        run: npm run test:viewing:gate

      - name: Post-match release gate
        run: npm run test:post-match:gate

      - name: Deal release gate
        run: npm run test:deal:gate

      - name: Focused viewing-completed regression
        run: node --test test/viewing-completed-deal-gate.test.mjs

      - name: Repository checks
        run: npm run check

      - name: Show isolated diff
        run: git diff --check && git status --short && git diff --stat

      - name: Commit tested product changes to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public src worker test
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix(viewing): add completion seriousness and deal gate"
          git push origin HEAD:fix/viewing-completed-deal-gate-20260908
