name: Inspect persisted match review

on:
  push:
    branches:
      - hotfix/daily-task-match-review-2026-09-13

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/unified-staging-lineage-2026-08-29
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect target operation read-only
        run: |
          cat > scripts/.inspect-match-review.mjs <<'EOF'
          import * as admin from "firebase-admin";
          import { getFirestore } from "firebase-admin/firestore";
          import { parseFirebaseServiceAccountJson } from "./staging-credentials.mjs";
          const PROJECT_ID = "iaqar-ai-staging";
          const OFFICE_ID = "staging-hamra";
          const MATCH_ID = "O-ydQV__A-CokU";
          const OP_ID = `op_match_${MATCH_ID}`;
          const parsed = parseFirebaseServiceAccountJson(process.env.FIREBASE_SERVICE_ACCOUNT_JSON, PROJECT_ID);
          if (!parsed.serviceAccount) throw new Error("STAGING_READ_ACCESS_UNAVAILABLE");
          const app = admin.initializeApp({ credential: admin.cert(parsed.serviceAccount), projectId: PROJECT_ID });
          const db = getFirestore(app);
          const [opSnap, matchSnap] = await Promise.all([
            db.doc(`offices/${OFFICE_ID}/operations/${OP_ID}`).get(),
            db.doc(`offices/${OFFICE_ID}/matches/${MATCH_ID}`).get()
          ]);
          const op = opSnap.data() || {};
          const match = matchSnap.data() || {};
          let metadata = {};
          try { metadata = JSON.parse(String(op.metadataJson || "{}")); } catch {}
          console.log(JSON.stringify({
            operationExists: opSnap.exists,
            matchExists: matchSnap.exists,
            operationId: OP_ID,
            matchId: MATCH_ID,
            status: op.status || "",
            type: op.type || "",
            topLevelIntegrityStatus: op.integrityStatus || "",
            metadata: {
              matchId: metadata.matchId || "",
              clientRequestId: metadata.clientRequestId || metadata.requestId || "",
              ownerOfferId: metadata.ownerOfferId || metadata.offerId || "",
              integrityStatus: metadata.integrityStatus || "",
              matchIntegrityStatus: metadata.matchIntegrityStatus || "",
              candidatePropertyType: metadata.candidatePropertyType || "",
              candidateDistrict: metadata.candidateDistrict || "",
              candidateCity: metadata.candidateCity || ""
            },
            match: {
              integrityStatus: match.integrityStatus || "",
              clientRequestId: match.clientRequestId || match.requestId || "",
              ownerOfferId: match.ownerOfferId || match.offerId || ""
            }
          }, null, 2));
          EOF
          node scripts/.inspect-match-review.mjs
