name: Admin activity separation patch

on:
  push:
    branches:
      - chore/admin-separation-phase11-20260907

permissions:
  contents: write

jobs:
  patch-activity-boundary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/admin-separation-phase11-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Move office activity out of Admin service
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('worker/src/admin-service.js')
          s = p.read_text()
          activity_import = 'import { recordOfficeActivityEvent } from "./office-activity-service.js";\n'
          anchor = '} from "./admin-domain.js";\n'
          if activity_import not in s:
            if anchor not in s: raise SystemExit('admin-domain import anchor missing')
            s = s.replace(anchor, anchor + activity_import, 1)

          s, count = re.subn(
            r'\nasync function recordActivityEvent\(helpers, \{[\s\S]*?\n\}\n\nexport async function recordAdminActivityEvent\(helpers, args\) \{[\s\S]*?\n\}\n\nexport async function recordOfficeLoginActivity\(helpers, \{[\s\S]*?\n\}\n',
            '\n', s, count=1
          )
          if count == 0 and ('async function recordActivityEvent' in s or 'export async function recordOfficeLoginActivity' in s):
            raise SystemExit('office activity block shape changed')
          s = s.replace('recordActivityEvent(helpers,', 'recordOfficeActivityEvent(helpers,')
          p.write_text(s)

          p = Path('worker/src/index.js')
          s = p.read_text()
          s = s.replace('  handleAdminSuspend,\n  recordAdminActivityEvent,\n  recordOfficeLoginActivity\n', '  handleAdminSuspend\n', 1)
          activity_import = 'import { recordOfficeActivityEvent, recordOfficeLoginActivity } from "./office-activity-service.js";\n'
          anchor = '} from "./admin-service.js";\n'
          if activity_import not in s:
            if anchor not in s: raise SystemExit('admin-service import end anchor missing')
            s = s.replace(anchor, anchor + activity_import, 1)
          s = s.replace('recordAdminActivityEvent(adminHelpers,', 'recordOfficeActivityEvent(adminHelpers,')
          p.write_text(s)

          admin_service = Path('worker/src/admin-service.js').read_text()
          index = Path('worker/src/index.js').read_text()
          if 'export async function recordOfficeLoginActivity' in admin_service or 'async function recordActivityEvent' in admin_service:
            raise SystemExit('Admin service still owns office activity recording')
          if './office-activity-service.js' not in admin_service or './office-activity-service.js' not in index:
            raise SystemExit('office activity service boundary not wired')
      - name: Validate activity boundary
        run: |
          node --check worker/src/office-activity-service.js
          node --check worker/src/admin-service.js
          node --check worker/src/index.js
          npm run test:admin:gate
      - name: Commit activity boundary
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/admin-service.js worker/src/index.js
          git commit -m "Admin: isolate office activity from control plane"
          git push origin HEAD:chore/admin-separation-phase11-20260907
