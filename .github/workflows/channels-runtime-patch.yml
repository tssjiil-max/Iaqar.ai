name: Channels runtime patch

on:
  push:
    branches:
      - chore/channels-bot-cleanup-phase8-20260907
    paths:
      - .github/channels-runtime-patch.trigger

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/channels-bot-cleanup-phase8-20260907
          fetch-depth: 0
      - name: Patch channel runtime
        run: |
          python scripts/patch-channels-runtime.py
          python scripts/patch-channels-tests.py
          python scripts/patch-whatsapp-channel-media.py
      - name: Validate patch
        run: |
          git diff --check
          node --check worker/src/index.js
          node --check worker/src/canonical-intake-service.js
          node --check worker/src/messaging-domain.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/src/canonical-intake-service.js worker/src/messaging-domain.js test/messaging-phase7.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Channels: retain WhatsApp media for canonical review"
          git push origin HEAD:chore/channels-bot-cleanup-phase8-20260907
