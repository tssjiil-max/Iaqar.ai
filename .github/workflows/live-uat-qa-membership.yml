name: Live UAT QA membership

on:
  push:
    branches:
      - qa/live-uat-membership-20260908
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_STAGING_PROJECT_ID: iaqar-ai-staging
  QA_E2E_OFFICE_ID: qa-e2e-dedicated
  STAGING_HOSTING_URL: https://iaqar-ai-staging--staging-9c4b0k7h.web.app
  STAGING_WORKER_URL: https://iaqar-intake-staging.iaqar-ai.workers.dev
  LIVE_E2E_OUT: artifacts
  LIVE_E2E_WORK: /tmp/iaqar-live-e2e

jobs:
  live-uat:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      STAGING_PHONE: ${{ secrets.STAGING_PHONE }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Expose Playwright Chromium at expected path
        run: |
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux/chrome' | head -n 1)"
          if [ -z "$CHROME_BIN" ]; then
            CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-headless-shell-linux/headless_shell' | head -n 1)"
          fi
          test -n "$CHROME_BIN"
          sudo ln -sf "$CHROME_BIN" /usr/local/bin/google-chrome
          /usr/local/bin/google-chrome --version || true

      - name: Bootstrap QA office membership
        run: node scripts/qa-e2e-office-membership-bootstrap.mjs

      - name: Prepare live UAT report paths
        run: |
          mkdir -p "$LIVE_E2E_OUT" "$LIVE_E2E_WORK"

      - name: Patch QA harness for current Staging UI and post-viewing chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/qa-live-negotiation-uat.mjs')
          s = p.read_text()

          old_tasks = '''async function openTasks(page) {
            await dismissOverlays(page);
            await page.locator("#mainTabOperations, button:has-text('المهام اليومية')").first().click();
            await page.waitForTimeout(1800);
            await page.waitForSelector("[data-cv2-exec-task], [data-cv2-exec-empty], #contentV2", { timeout: 60000 });
          }'''
          new_tasks = '''async function openTasks(page) {
            await page.goto(`${STAGING_URL}/?office=${encodeURIComponent(OFFICE_ID)}`, {
              waitUntil: "domcontentloaded",
              timeout: 120000
            });
            await page.waitForFunction(() => !document.body.classList.contains("access-locked"), {
              timeout: 120000
            });
            await dismissOverlays(page);
            await page.locator("#mainTabOperations, button:has-text('المهام اليومية')").first().click();
            await page.waitForTimeout(1800);
            await page.waitForSelector("[data-cv2-exec-task], [data-cv2-exec-empty], #contentV2", { timeout: 60000 });
          }'''
          if old_tasks not in s:
              raise SystemExit('openTasks QA patch target not found')
          s = s.replace(old_tasks, new_tasks)

          old_shot = '''async function shot(page, name) {
            const file = path.join(OUT, name);
            await page.screenshot({ path: file, fullPage: true });
            artifacts.push(file);
          }'''
          new_shot = '''async function shot(page, name) {
            const file = path.join(OUT, name);
            try {
              await page.screenshot({ path: file, fullPage: false, timeout: 10000 });
              artifacts.push(file);
            } catch (error) {
              console.warn(`[EVIDENCE WARN] ${name}: ${error?.message || error}`);
            }
          }'''
          if old_shot not in s:
              raise SystemExit('shot QA patch target not found')
          s = s.replace(old_shot, new_shot)

          old_owner = '''  const viewingYes = packageRoot.locator('[data-package-field="viewingAllowed"][value="yes"]');
            if (await viewingYes.count()) {
              await viewingYes.check({ force: true });
              await page.waitForTimeout(250);
              await chooseFirstVisible(page, '[data-package-field="viewingDays"]');
              await chooseFirstVisible(page, '[data-package-field="viewingPeriods"]');
            }'''
          new_owner = '''  const viewingYes = packageRoot.locator('[data-package-field="viewingAllowed"][value="yes"]');
            if (await viewingYes.count()) {
              await viewingYes.check({ force: true });
              await page.waitForTimeout(250);
              await chooseFirstVisible(page, '[data-package-field="viewingDays"]');
              await chooseFirstVisible(page, '[data-package-field="viewingPeriods"]');
            } else if (workflowStep === "owner_viewing") {
              const currentRadios = packageRoot.locator('input[type="radio"]');
              const radioCount = await currentRadios.count();
              let selected = false;
              for (let i = 0; i < radioCount; i += 1) {
                const radio = currentRadios.nth(i);
                if (await radio.isVisible().catch(() => false)) {
                  await radio.check({ force: true });
                  console.log(`[QA] owner_viewing selected field=${await radio.getAttribute("data-package-field") || await radio.getAttribute("name") || "radio"} value=${await radio.getAttribute("value") || ""}`);
                  selected = true;
                  break;
                }
              }
              if (!selected) throw new Error("owner_viewing has no selectable radio option");
            }'''
          if old_owner not in s:
              raise SystemExit('owner viewing QA patch target not found')
          s = s.replace(old_owner, new_owner)

          old_owner_response = '''  const response = await responseWaiter;
            const body = await response.json().catch(() => ({}));
            await page.waitForSelector(".party-recorded, [data-testid='party-bundle-recorded'], [data-party-decision-package]", { timeout: 30000 });
            return { status: response.status(), body, workflowStep };'''
          new_owner_response = '''  const response = await responseWaiter;
            const body = await response.json().catch(() => ({}));
            console.log(`[QA] owner bundle request=${response.request().postData() || ""}`);
            console.log(`[QA] owner bundle response status=${response.status()} body=${JSON.stringify(body)}`);
            await page.waitForSelector(".party-recorded, [data-testid='party-bundle-recorded'], [data-party-decision-package]", { timeout: 30000 });
            return { status: response.status(), body, workflowStep };'''
          if old_owner_response not in s:
              raise SystemExit('owner response QA diagnostic patch target not found')
          s = s.replace(old_owner_response, new_owner_response)

          old_cleanup = '''async function cleanup() {
            const direct = [
              officeRef.collection("opportunities").doc(ids.incomplete),
              officeRef.collection("opportunities").doc(ids.request),
              officeRef.collection("opportunities").doc(ids.offer),
              officeRef.collection("matches").doc(ids.match),
              officeRef.collection("operations").doc(ids.operation)
            ];
            await Promise.all(direct.map((ref) => ref.delete().catch(() => null)));
            for (const name of ["partySessions", "partySessionKeys", "coordinationSessions", "notifications"]) {
              try { await deleteQuery(officeRef.collection(name).where("matchId", "==", ids.match)); } catch { /* optional collection/index */ }
            }
          }'''
          new_cleanup = '''async function cleanup() {
            const dealId = `deal_${ids.match.replace(/^mat_/, "")}`;
            const dealRef = officeRef.collection("deals").doc(dealId);
            try { await deleteQuery(dealRef.collection("timeline")); } catch { /* optional timeline */ }
            await dealRef.delete().catch(() => null);
            const direct = [
              officeRef.collection("opportunities").doc(ids.incomplete),
              officeRef.collection("opportunities").doc(ids.request),
              officeRef.collection("opportunities").doc(ids.offer),
              officeRef.collection("matches").doc(ids.match),
              officeRef.collection("operations").doc(ids.operation)
            ];
            await Promise.all(direct.map((ref) => ref.delete().catch(() => null)));
            for (const name of ["partySessions", "partySessionKeys", "coordinationSessions", "notifications"]) {
              try { await deleteQuery(officeRef.collection(name).where("matchId", "==", ids.match)); } catch { /* optional collection/index */ }
            }
          }'''
          if old_cleanup not in s:
              raise SystemExit('cleanup QA patch target not found')
          s = s.replace(old_cleanup, new_cleanup)

          old_run = '''async function run() {'''
          new_run = '''async function brokerPost(page, route, body) {
            return page.evaluate(async ({ route, body }) => {
              const user = window.firebase?.auth?.()?.currentUser;
              if (!user?.getIdToken) throw new Error("broker auth token unavailable");
              const token = await user.getIdToken();
              const base = typeof window.IAQAR?.resolveWorkerBase === "function"
                ? window.IAQAR.resolveWorkerBase()
                : String(window.IAQAR?.workerBase || "").replace(/\\/+$/, "");
              const response = await fetch(`${base}${route}`, {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: `Bearer ${token}`
                },
                body: JSON.stringify(body)
              });
              const payload = await response.json().catch(() => ({}));
              return { status: response.status, body: payload };
            }, { route, body });
          }

          async function run() {'''
          if old_run not in s:
              raise SystemExit('run QA patch target not found')
          s = s.replace(old_run, new_run, 1)

          anchor = '    addResult("Same taskId after owner", taskIdAfterOwner === taskIdBefore, { taskIdBefore, taskIdAfterOwner });'
          extension = '''

            const candidateBeforeConfirm = (await officeRef.collection("matches").doc(ids.match).get()).data() || {};
            addResult("Viewing candidate generated", Boolean(candidateBeforeConfirm.viewingCandidateAt), {
              note: `candidate=${candidateBeforeConfirm.viewingCandidateAt || ""} stage=${candidateBeforeConfirm.livingStage || ""}`
            });

            const confirmViewing = card.locator('[data-cv2-exec-primary="confirm_viewing"], [data-cv2-exec-secondary="confirm_viewing"]').first();
            addResult("Confirm viewing action appears", (await confirmViewing.count()) > 0, { count: await confirmViewing.count() });
            if (!(await confirmViewing.count())) throw new Error("confirm_viewing action did not appear at APPOINTMENT_COORDINATION");
            const confirmWaiter = broker.waitForResponse((res) => res.url().includes("/match/living-action") && res.request().method() === "POST", { timeout: 45000 });
            await confirmViewing.click();
            const confirmResponse = await confirmWaiter;
            const confirmBody = await confirmResponse.json().catch(() => ({}));
            addResult("Viewing appointment confirmed through Daily Tasks UI", confirmResponse.status() >= 200 && confirmResponse.status() < 300 && confirmBody.livingStage === "APPOINTMENT_CONFIRMED", {
              status: confirmResponse.status(),
              note: `livingStage=${confirmBody.livingStage || ""} appointmentStatus=${confirmBody.appointmentStatus || ""}`
            });
            await broker.waitForTimeout(1200);
            const matchAfterConfirm = (await officeRef.collection("matches").doc(ids.match).get()).data() || {};
            addResult("Confirmed viewing persisted", matchAfterConfirm.livingStage === "APPOINTMENT_CONFIRMED" && String(matchAfterConfirm.appointmentStatus || "").toUpperCase() === "CONFIRMED" && Boolean(matchAfterConfirm.appointmentAt) && Boolean(matchAfterConfirm.viewingAt), {
              note: `stage=${matchAfterConfirm.livingStage || ""} status=${matchAfterConfirm.appointmentStatus || ""} at=${matchAfterConfirm.appointmentAt || matchAfterConfirm.viewingAt || ""}`
            });
            await shot(broker, "qa-neg-09-viewing-confirmed.png");

            const createDeal = await brokerPost(broker, "/workflow/action", {
              officeId: OFFICE_ID,
              action: "create_deal",
              recordId: ids.match,
              note: "QA: confirmed viewing entered deal chain"
            });
            const dealId = String(createDeal.body?.dealId || "");
            addResult("Deal created from confirmed viewing", createDeal.status >= 200 && createDeal.status < 300 && createDeal.body?.ok === true && Boolean(dealId), {
              status: createDeal.status,
              note: `dealId=${dealId} stage=${createDeal.body?.workflowStage || ""}`
            });
            if (!dealId) throw new Error(`deal creation failed: ${JSON.stringify(createDeal)}`);
            const dealRef = officeRef.collection("deals").doc(dealId);
            const dealAfterCreate = (await dealRef.get()).data() || {};
            addResult("Deal linkage persisted", dealAfterCreate.matchId === ids.match && dealAfterCreate.clientRequestId === ids.request && (dealAfterCreate.ownerOfferId === ids.offer || dealAfterCreate.offerId === ids.offer) && dealAfterCreate.workflowStage === "contact", {
              note: `matchId=${dealAfterCreate.matchId || ""} stage=${dealAfterCreate.workflowStage || ""}`
            });

            const enterViewing = await brokerPost(broker, "/workflow/action", {
              officeId: OFFICE_ID,
              action: "advance_deal",
              recordId: dealId,
              note: "QA: enter viewing stage"
            });
            addResult("Deal entered viewing stage", enterViewing.status >= 200 && enterViewing.status < 300 && enterViewing.body?.workflowStage === "viewing", {
              status: enterViewing.status,
              note: `stage=${enterViewing.body?.workflowStage || ""}`
            });

            const completeViewing = await brokerPost(broker, "/workflow/action", {
              officeId: OFFICE_ID,
              action: "advance_deal",
              recordId: dealId,
              note: "QA: viewing completed; enter negotiation"
            });
            addResult("Viewing completed into seriousness/negotiation", completeViewing.status >= 200 && completeViewing.status < 300 && completeViewing.body?.workflowStage === "negotiation", {
              status: completeViewing.status,
              note: `stage=${completeViewing.body?.workflowStage || ""}`
            });
            const dealAfterNegotiation = (await dealRef.get()).data() || {};
            addResult("Negotiation stage persisted", dealAfterNegotiation.workflowStage === "negotiation" && dealAfterNegotiation.status === "open", {
              note: `stage=${dealAfterNegotiation.workflowStage || ""} status=${dealAfterNegotiation.status || ""}`
            });

            const skipAttempt = await brokerPost(broker, "/workflow/action", {
              officeId: OFFICE_ID,
              action: "set_deal_stage",
              recordId: dealId,
              stage: "closing",
              note: "QA: invalid skip guard"
            });
            addResult("Deal stage skip is rejected", skipAttempt.status === 409 && skipAttempt.body?.error === "deal_stage_skip", {
              status: skipAttempt.status,
              note: `error=${skipAttempt.body?.error || ""}`
            });

            const timelineSnap = await dealRef.collection("timeline").get();
            const timelineStages = timelineSnap.docs.map((doc) => String(doc.data()?.stage || ""));
            addResult("Deal timeline records viewing and negotiation", timelineStages.includes("viewing") && timelineStages.includes("negotiation"), {
              note: `stages=${timelineStages.join(",")}`
            });'''
          if anchor not in s:
              raise SystemExit('post-viewing QA anchor not found')
          s = s.replace(anchor, anchor + extension, 1)

          p.write_text(s)
          PY

      - name: Run current negotiation + post-viewing live UAT
        run: node scripts/qa-live-negotiation-uat.mjs

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-uat-qa-membership-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
