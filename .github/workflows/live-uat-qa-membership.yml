name: Live UAT QA membership

on:
  push:
    branches:
      - qa/live-uat-membership-20260908
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_STAGING_PROJECT_ID: iaqar-ai-staging
  QA_E2E_OFFICE_ID: qa-e2e-dedicated
  STAGING_HOSTING_URL: https://iaqar-ai-staging--staging-9c4b0k7h.web.app
  STAGING_WORKER_URL: https://iaqar-intake-staging.iaqar-ai.workers.dev
  LIVE_E2E_OUT: artifacts
  LIVE_E2E_WORK: /tmp/iaqar-live-e2e

jobs:
  live-uat:
    runs-on: ubuntu-latest
    environment: staging
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      STAGING_PHONE: ${{ secrets.STAGING_PHONE }}
      STAGING_PASSWORD: ${{ secrets.STAGING_PASSWORD }}

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Expose Playwright Chromium at expected path
        run: |
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux/chrome' | head -n 1)"
          if [ -z "$CHROME_BIN" ]; then
            CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-headless-shell-linux/headless_shell' | head -n 1)"
          fi
          test -n "$CHROME_BIN"
          sudo ln -sf "$CHROME_BIN" /usr/local/bin/google-chrome
          /usr/local/bin/google-chrome --version || true

      - name: Bootstrap QA office membership
        run: node scripts/qa-e2e-office-membership-bootstrap.mjs

      - name: Prepare live UAT report paths
        run: |
          mkdir -p "$LIVE_E2E_OUT" "$LIVE_E2E_WORK"

      - name: Run current negotiation live UAT
        run: node scripts/qa-live-negotiation-uat.mjs

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-uat-qa-membership-${{ github.run_id }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
