name: Claude visual unification — full width matrix

on:
  push:
    branches:
      - claude/visual-unification-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  widths:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npx playwright install --with-deps chromium
      - name: Full 7-width matrix across every discovered screen
        run: |
          WIDTHS=320,360,390,430,768,1024,1440 OUT_DIR=qa/visual-unification-widths node scripts/qa/office-os/mobile-widths.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-unification-widths-evidence
          path: qa/visual-unification-widths
          retention-days: 14
