name: Apply MATCH_REVIEW reconciliation fix

on:
  push:
    branches:
      - fix/match-review-reconcile-20260918

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply MATCH_REVIEW reconciliation fix runner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/match-review-reconcile-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch duplicate-match path
        run: python .github/scripts/apply_match_review_reconcile_fix.py
      - name: Run focused regression
        run: node worker/test/match-review-reconcile.test.mjs
      - name: Commit fix
        run: |
          git config user.name 'tssjiil-max'
          git config user.email 'tssjiil@gmail.com'
          git add worker/src/index.js
          git commit -m 'fix: reconcile MATCH_REVIEW for existing matches'
          git push origin HEAD:fix/match-review-reconcile-20260918
