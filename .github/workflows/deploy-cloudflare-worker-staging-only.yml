name: Deploy Cloudflare Worker staging only

on:
  push:
    branches:
      - codex/cloudflare-worker-staging-only-20260923
    paths:
      - .github/workflows/deploy-cloudflare-worker-staging-only.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iaqar-intake-staging-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/cloudflare-worker-staging-only-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check staging target and configuration
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path('worker/wrangler.toml').read_text())
          staging = config['env']['staging']
          assert staging['name'] == 'iaqar-intake-staging'
          assert staging['workers_dev'] is True
          assert staging['vars']['FIREBASE_PROJECT_ID'] == 'iaqar-ai-staging'
          assert staging['vars']['DEPLOYMENT_ENV'] == 'staging'
          assert not staging.get('routes') and not staging.get('route')
          print('Staging target verified')
          PY

      - name: Test MATCH_REVIEW daily task regression
        run: node --test test/match-review-daily-task-regression.test.mjs

      - name: Check required GitHub Actions secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo 'Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets.' >&2
            exit 1
          fi
          echo 'Required secrets available'

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Deploy staging Worker only
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

      - name: Verify staging health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            https://iaqar-intake-staging.iaqar-ai.workers.dev/health
