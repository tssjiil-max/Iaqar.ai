name: Build Tahdeeri APK

on:
  push:
    branches:
      - tool/tahdeeri-apk-build
    paths:
      - 'tahdeeri-apk/**'
      - '.github/workflows/build-tahdeeri-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tahdeeri-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../tahdeeri-weekly-lite.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tahdeeri-weekly-lite-apk
          path: tahdeeri-weekly-lite.apk
          if-no-files-found: error
          retention-days: 7
