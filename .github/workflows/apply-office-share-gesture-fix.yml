name: Apply office share gesture fix

on:
  push:
    branches:
      - fix/staging-office-share-gesture-20260918

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/staging-office-share-gesture-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: python scripts/patch-office-share-gesture.py
      - name: Syntax check
        run: node --check public/js/office-settings.js
      - name: Commit patched runtime
        run: |
          if git diff --quiet -- public/js/office-settings.js; then
            echo "No runtime change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/js/office-settings.js
          git commit -m "fix(staging): preserve user gesture for office link sharing"
          git push origin HEAD:fix/staging-office-share-gesture-20260918
