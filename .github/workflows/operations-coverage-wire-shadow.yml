name: Wire operation coverage shadow observers

on:
  push:
    branches:
      - chore/operations-coverage-phase1-20260907
    paths:
      - .github/workflows/operations-coverage-wire-shadow.yml

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/operations-coverage-phase1-20260907
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix worker
      - name: Apply shadow wiring
        run: node worker/tools/wire-operations-coverage-shadow.mjs
      - name: Run tests
        run: npm test
      - name: Run static checks
        run: npm run check
      - name: Commit wired code
        run: |
          if git diff --quiet -- worker/src/index.js worker/src/canonical-intake-service.js; then
            echo "No wiring diff produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/src/canonical-intake-service.js
          git commit -m "Wire operation coverage shadow observers"
          git push origin HEAD:chore/operations-coverage-phase1-20260907
