name: Cooperation runtime patch

on:
  push:
    branches:
      - chore/cooperation-cleanup-phase7-20260907
    paths:
      - .github/cooperation-runtime-patch.trigger

permissions:
  contents: write

jobs:
  patch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: chore/cooperation-cleanup-phase7-20260907
          fetch-depth: 0
      - name: Patch cooperation runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('worker/src/cooperation-phase6-service.js')
          src = service_path.read_text()

          import_anchor = 'import { normalizeOpportunitySide } from "./matching-engine.js";\n'
          import_block = '''import {\n  COOPERATION_SUBCONTRACT_STATUS,\n  planAcceptedCooperationSubcontract,\n  planCooperationSubcontractUpdate\n} from "./cooperation-contract-domain.js";\n'''
          if 'from "./cooperation-contract-domain.js"' not in src:
              if import_anchor not in src:
                  raise SystemExit('cooperation service import anchor not found')
              src = src.replace(import_anchor, import_anchor + import_block, 1)

          signature_old = '''  action,\n  reason = "",\n  accessToken,\n  deps\n}) {'''
          signature_new = '''  action,\n  reason = "",\n  subcontractStatus = "",\n  subcontractReference = "",\n  primaryBrokerageContractId = "",\n  accessToken,\n  deps\n}) {'''
          if 'subcontractStatus = ""' not in src:
              if signature_old not in src:
                  raise SystemExit('cooperation lifecycle signature anchor not found')
              src = src.replace(signature_old, signature_new, 1)

          decision_anchor = '''  const decision = String(action || "").toUpperCase();\n  if (["ACCEPT", "ACCEPTED", "REJECT", "REJECTED", "REQUEST_DETAILS", "DETAILS_REQUESTED"].includes(decision) && actorOfficeId !== target) {'''
          decision_new = '''  const decision = String(action || "").toUpperCase();\n  if (decision === "SET_SUBCONTRACT_STATUS") {\n    const contractPlan = planCooperationSubcontractUpdate({\n      cooperation: request,\n      requestedStatus: subcontractStatus,\n      subcontractReference,\n      primaryBrokerageContractId,\n      now: new Date()\n    });\n    if (!contractPlan.ok) {\n      const status = contractPlan.reason === "cooperation_not_accepted" ? 409\n        : contractPlan.reason === "primary_brokerage_contract_required" ? 409\n        : contractPlan.reason === "signed_subcontract_terminal" ? 409\n        : 400;\n      return { ok: false, error: contractPlan.reason, status };\n    }\n    if (!contractPlan.idempotent) {\n      const p = contractPlan.patch;\n      const contractFields = {\n        originatingOfficeId: firestoreHelpers.firestoreString(origin),\n        targetOfficeId: firestoreHelpers.firestoreString(target),\n        subcontractRequired: firestoreHelpers.firestoreBoolean(true),\n        subcontractStatus: firestoreHelpers.firestoreString(p.subcontractStatus),\n        subcontractReference: firestoreHelpers.firestoreString(p.subcontractReference || ""),\n        primaryBrokerageContractId: firestoreHelpers.firestoreString(p.primaryBrokerageContractId || ""),\n        subcontractUpdatedAt: firestoreHelpers.firestoreTimestamp(new Date(p.subcontractUpdatedAt)),\n        updatedAt: firestoreHelpers.firestoreTimestamp(new Date())\n      };\n      if (p.subcontractSignedAt) contractFields.subcontractSignedAt = firestoreHelpers.firestoreTimestamp(new Date(p.subcontractSignedAt));\n      if (p.subcontractCancelledAt) contractFields.subcontractCancelledAt = firestoreHelpers.firestoreTimestamp(new Date(p.subcontractCancelledAt));\n      await setFirestoreDocument({\n        projectId,\n        segments: ["cooperationRequests", cooperationId],\n        accessToken,\n        fields: contractFields\n      });\n      if (p.subcontractStatus === COOPERATION_SUBCONTRACT_STATUS.SIGNED) {\n        await writeSubcontractLibraryEntriesOnSign({\n          projectId,\n          accessToken,\n          agreementId: cooperationId,\n          originatingOfficeId: origin,\n          targetOfficeId: target,\n          subcontractReference: p.subcontractReference,\n          primaryBrokerageContractId: p.primaryBrokerageContractId,\n          getFirestoreDocument,\n          setFirestoreDocument,\n          firestoreFieldsToJs,\n          firestoreHelpers\n        });\n      }\n    }\n    return {\n      ok: true,\n      cooperationId,\n      status: String(request.status || "").toUpperCase(),\n      subcontractStatus: contractPlan.requested,\n      subcontractReference: contractPlan.patch?.subcontractReference || request.subcontractReference || "",\n      primaryBrokerageContractId: contractPlan.patch?.primaryBrokerageContractId || request.primaryBrokerageContractId || "",\n      idempotent: Boolean(contractPlan.idempotent),\n      opportunityIds: Array.isArray(request.opportunityIds) ? request.opportunityIds : []\n    };\n  }\n  if (["ACCEPT", "ACCEPTED", "REJECT", "REJECTED", "REQUEST_DETAILS", "DETAILS_REQUESTED"].includes(decision) && actorOfficeId !== target) {'''
          if 'decision === "SET_SUBCONTRACT_STATUS"' not in src:
              if decision_anchor not in src:
                  raise SystemExit('decision anchor not found')
              src = src.replace(decision_anchor, decision_new, 1)

          accepted_stage_old = '''    if (nextStatusPreview === "ACCEPTED") {\n      fields.currentStage = firestoreHelpers.firestoreString("COOPERATION_ACCEPTED");\n    }'''
          accepted_stage_new = '''    if (nextStatusPreview === "ACCEPTED") {\n      fields.currentStage = firestoreHelpers.firestoreString("COOPERATION_ACCEPTED");\n      const subcontract = planAcceptedCooperationSubcontract({ cooperation: request, now: new Date() });\n      fields.subcontractRequired = firestoreHelpers.firestoreBoolean(true);\n      fields.subcontractStatus = firestoreHelpers.firestoreString(subcontract.subcontractStatus);\n      fields.subcontractReference = firestoreHelpers.firestoreString(subcontract.subcontractReference || "");\n      fields.primaryBrokerageContractId = firestoreHelpers.firestoreString(subcontract.primaryBrokerageContractId || "");\n      fields.subcontractUpdatedAt = firestoreHelpers.firestoreTimestamp(new Date(subcontract.subcontractUpdatedAt));\n    }'''
          if 'planAcceptedCooperationSubcontract({ cooperation: request' not in src:
              if accepted_stage_old not in src:
                  raise SystemExit('accepted stage anchor not found')
              src = src.replace(accepted_stage_old, accepted_stage_new, 1)

          auto_agreement = '''    await writeAgreementLibraryEntriesOnAccept({\n      projectId,\n      accessToken,\n      agreementId: cooperationId,\n      originatingOfficeId: origin,\n      targetOfficeId: target,\n      getFirestoreDocument,\n      setFirestoreDocument,\n      firestoreFieldsToJs,\n      firestoreHelpers\n    });\n'''
          if auto_agreement in src:
              src = src.replace(auto_agreement, '', 1)

          src = src.replace('async function writeAgreementLibraryEntriesOnAccept({', 'async function writeSubcontractLibraryEntriesOnSign({', 1)
          args_anchor = '''  targetOfficeId,\n  commissionRate = null,\n  getFirestoreDocument,'''
          args_new = '''  targetOfficeId,\n  commissionRate = null,\n  subcontractReference = "",\n  primaryBrokerageContractId = "",\n  getFirestoreDocument,'''
          if 'subcontractReference = ""' not in src.split('async function writeSubcontractLibraryEntriesOnSign',1)[-1][:500]:
              if args_anchor not in src:
                  raise SystemExit('subcontract writer args anchor not found')
              src = src.replace(args_anchor, args_new, 1)

          base_anchor = '''    kind: fh.firestoreString("agreement"),\n    agreementId: fh.firestoreString(agreementId),\n    fileName: fh.firestoreString("اتفاقية-تعاون.pdf"),\n    contentType: fh.firestoreString("application/pdf"),\n    mediaPath: fh.firestoreString(""),\n    agreementStatus: fh.firestoreString("ACTIVE"),'''
          base_new = '''    kind: fh.firestoreString("agreement"),\n    agreementType: fh.firestoreString("broker_subcontract"),\n    agreementId: fh.firestoreString(agreementId),\n    fileName: fh.firestoreString("عقد-تعاون-فرعي.pdf"),\n    contentType: fh.firestoreString("application/pdf"),\n    mediaPath: fh.firestoreString(""),\n    agreementStatus: fh.firestoreString("SIGNED"),\n    subcontractReference: fh.firestoreString(String(subcontractReference || "")),\n    primaryBrokerageContractId: fh.firestoreString(String(primaryBrokerageContractId || "")),'''
          if 'agreementType: fh.firestoreString("broker_subcontract")' not in src:
              if base_anchor not in src:
                  raise SystemExit('subcontract library base anchor not found')
              src = src.replace(base_anchor, base_new, 1)

          service_path.write_text(src)

          workflow_path = Path('worker/src/cooperation-workflow-service.js')
          w = workflow_path.read_text()
          workflow_import_anchor = 'import { upsertCooperationOperations } from "./operations-service.js";\n'
          workflow_import = '''import {\n  canonicalOwnerForCooperationWorkflowAction,\n  cooperationWorkflowActionIsDelegated\n} from "./cooperation-contract-domain.js";\n'''
          if 'cooperationWorkflowActionIsDelegated' not in w.split('\n', 30)[0:30]:
              if 'from "./cooperation-contract-domain.js"' not in w:
                  if workflow_import_anchor not in w:
                      raise SystemExit('workflow import anchor not found')
                  w = w.replace(workflow_import_anchor, workflow_import_anchor + workflow_import, 1)

          workflow_guard_anchor = '''  const request = hydrateCooperation(cooperationId, deps.firestoreFieldsToJs(coopDoc.fields || {}));\n  const applied = applyCooperationWorkflowTransition(request, action, { actorOfficeId });'''
          workflow_guard_new = '''  const request = hydrateCooperation(cooperationId, deps.firestoreFieldsToJs(coopDoc.fields || {}));\n  if (cooperationWorkflowActionIsDelegated(action)) {\n    const canonicalOwner = canonicalOwnerForCooperationWorkflowAction(action);\n    return {\n      ok: false,\n      error: "canonical_transaction_required",\n      status: 409,\n      canonicalOwner,\n      message: canonicalOwner === "coordinationSessions"\n        ? "متابعة العميل والمالك تتم داخل جلسة التفاوض."\n        : canonicalOwner === "matches"\n          ? "تأكيد المعاينة يتم من سجل المطابقة."\n          : "الاتفاق والإغلاق يتمان من سجل الصفقة."\n    };\n  }\n  const applied = applyCooperationWorkflowTransition(request, action, { actorOfficeId });'''
          if 'error: "canonical_transaction_required"' not in w:
              if workflow_guard_anchor not in w:
                  raise SystemExit('workflow delegation anchor not found')
              w = w.replace(workflow_guard_anchor, workflow_guard_new, 1)
          workflow_path.write_text(w)

          index_path = Path('worker/src/index.js')
          idx = index_path.read_text()
          handler_anchor = '''  const action = cleanText(body.action, 40).toUpperCase();\n  const reason = cleanText(body.reason, 200);\n  if (!officeId) throw appError("office_id_required", 400, "تعذر تحديد المكتب");'''
          handler_new = '''  const action = cleanText(body.action, 40).toUpperCase();\n  const reason = cleanText(body.reason, 200);\n  const subcontractStatus = cleanText(body.subcontractStatus || body.contractStatus, 40).toLowerCase();\n  const subcontractReference = cleanText(body.subcontractReference || body.contractReference, 180);\n  const primaryBrokerageContractId = cleanText(body.primaryBrokerageContractId, 180);\n  if (!officeId) throw appError("office_id_required", 400, "تعذر تحديد المكتب");'''
          lifecycle_start = idx.find('async function handleCooperationLifecycle(')
          if lifecycle_start < 0:
              raise SystemExit('lifecycle handler not found')
          lifecycle_end = idx.find('\nasync function handleCooperationScopeRevoke', lifecycle_start)
          segment = idx[lifecycle_start:lifecycle_end]
          if 'const subcontractStatus =' not in segment:
              if handler_anchor not in segment:
                  raise SystemExit('lifecycle handler parse anchor not found')
              segment = segment.replace(handler_anchor, handler_new, 1)

          call_anchor = '''    action,\n    reason,\n    accessToken,'''
          call_new = '''    action,\n    reason,\n    subcontractStatus,\n    subcontractReference,\n    primaryBrokerageContractId,\n    accessToken,'''
          if '    subcontractStatus,\n    subcontractReference,' not in segment:
              if call_anchor not in segment:
                  raise SystemExit('lifecycle call anchor not found')
              segment = segment.replace(call_anchor, call_new, 1)

          response_anchor = '''    status: result.status,\n    projectionsWritten: result.projectionsWritten,'''
          response_new = '''    status: result.status,\n    subcontractStatus: result.subcontractStatus || "",\n    subcontractReference: result.subcontractReference || "",\n    primaryBrokerageContractId: result.primaryBrokerageContractId || "",\n    projectionsWritten: result.projectionsWritten,'''
          if 'subcontractStatus: result.subcontractStatus' not in segment:
              if response_anchor not in segment:
                  raise SystemExit('lifecycle response anchor not found')
              segment = segment.replace(response_anchor, response_new, 1)
          idx = idx[:lifecycle_start] + segment + idx[lifecycle_end:]
          index_path.write_text(idx)
          PY
      - name: Commit runtime wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/cooperation-phase6-service.js worker/src/cooperation-workflow-service.js worker/src/index.js
          if git diff --cached --quiet; then
            echo "No cooperation runtime patch needed"
            exit 0
          fi
          git commit -m "Cooperation: enforce subcontract and canonical transaction ownership"
          git push origin HEAD:chore/cooperation-cleanup-phase7-20260907
