name: Apply approved readiness fix

on:
  push:
    branches:
      - fix/simplified-review-advertiser-role-20260918
    paths:
      - .github/run-apply-approved-readiness-fix.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simplified-review-advertiser-role-20260918
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply approved-readiness patch
        run: python .github/scripts/apply_approved_readiness_fix.py
      - name: Verify focused regressions
        run: node --test test/simplified-review-advertiser-role.test.mjs test/add-opportunity-approved-readiness.test.mjs
      - name: Commit verified production change
        run: |
          git config user.name 'tssjiil-max'
          git config user.email 'tssjiil@gmail.com'
          git add public/js/add-opportunity.js
          git commit -m 'fix: persist matching readiness after review approval'
          git push origin HEAD:fix/simplified-review-advertiser-role-20260918
