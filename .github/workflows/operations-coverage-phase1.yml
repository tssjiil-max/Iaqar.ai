name: Validate architecture phases

on:
  push:
    branches:
      - chore/operations-coverage-phase1-20260907
      - chore/core-intake-completion-phase1-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install worker dependencies
        run: npm ci --prefix worker
      - name: Run tests
        run: npm test
      - name: Run static checks
        run: npm run check
