name = "iaqar-macrodroid-intake"
main = "src/index.js"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "aqar-b5d76"
DEPLOYMENT_ENV = "production"
META_GRAPH_VERSION = "v25.0"
META_APP_ID = ""
META_CONFIG_ID = ""
FCM_WEB_PUSH_VAPID_KEY = ""

[triggers]
crons = ["0 * * * *"]

[ai]
binding = "AI"

[[r2_buckets]]
binding = "IAQAR_MEDIA"
bucket_name = "iaqar-media"

# ---------------------------------------------------------------------------
# Phase 9A — staging Worker. Deploy ONLY via: wrangler deploy --env staging
# Never point custom production routes at this env.
# ---------------------------------------------------------------------------
[env.staging]
name = "iaqar-intake-staging"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[env.staging.vars]
FIREBASE_PROJECT_ID = "iaqar-ai-staging"
DEPLOYMENT_ENV = "staging"
META_GRAPH_VERSION = "v25.0"
META_APP_ID = ""
META_CONFIG_ID = ""
FCM_WEB_PUSH_VAPID_KEY = "BD17gmynZ5N6PTXMSKPDx-h36-K_PrqqGMGHd8Hg-G0XjIBrDLRai_htH21Csc-oKJbdur1NDbareOf2I0fy5cU"
GEMINI_MODEL = "gemini-3.1-flash-lite"

[env.staging.ai]
binding = "AI"

[[env.staging.r2_buckets]]
binding = "IAQAR_MEDIA"
bucket_name = "iaqar-media"

# No hourly cron on staging — shared Firestore must not get dual follow-up writers.
[env.staging.triggers]
crons = []
